<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#7a3fb0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Lluvia de chuches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600;700;800&display=swap">
<style>
:root{--ink:#2a1640;--card:#fffaf3;--good:#18a058;--bad:#e0303a;--gold:#ffc83d;
  --display:"Young Serif",Georgia,serif;--body:"Figtree",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#3b1d63;font-family:var(--body);color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;pointer-events:none;z-index:5}
.hud>*{pointer-events:auto}
.snd{position:fixed;z-index:12;left:max(12px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 62px);width:44px;height:44px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#5a2b8c;box-shadow:0 4px 12px rgba(40,10,70,.35);cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
.snd[aria-pressed=false]{color:#a08cb3;background:rgba(255,255,255,.7)}
.snd.beat{animation:beat .3s}@keyframes beat{50%{transform:scale(1.12)}}
.back{width:44px;height:44px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#5a2b8c;box-shadow:0 4px 12px rgba(40,10,70,.35);text-decoration:none}
.target{justify-self:center;background:linear-gradient(180deg,#fff,#ffeefa);border:3px solid #fff;border-radius:16px;padding:6px 14px;text-align:center;box-shadow:0 6px 18px rgba(40,10,70,.35);max-width:100%}
.target small{display:block;font:800 10.5px var(--body);letter-spacing:.14em;text-transform:uppercase;color:#a0478f}
.target b{display:block;font:400 clamp(18px,5.4vw,24px)/1.1 var(--display);color:#5a2b8c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.target{min-width:min(230px,52vw)}
.hrow{display:flex;align-items:center;gap:5px;margin-top:3px}.hico{font-size:14px;line-height:1}
.hbar{position:relative;flex:1;height:14px;border-radius:9px;background:#efe3f7;box-shadow:inset 0 2px 3px rgba(60,20,90,.25);overflow:hidden}
.hbar i{position:absolute;left:0;top:0;bottom:0;width:50%;border-radius:9px;transition:width .35s cubic-bezier(.2,1.4,.4,1),background .3s}
.hbar i::after{content:"";position:absolute;left:4px;right:4px;top:2px;height:4px;border-radius:4px;background:rgba(255,255,255,.55)}
.hbar s{position:absolute;left:50%;top:2px;bottom:2px;width:2px;background:rgba(90,43,140,.25)}
.hbar.up{animation:hup .45s}.hbar.down{animation:hdown .45s}
@keyframes hup{40%{box-shadow:0 0 0 3px #8fd9a8,inset 0 2px 3px rgba(60,20,90,.25)}}
@keyframes hdown{20%{transform:translateX(-3px)}40%{transform:translateX(3px);box-shadow:0 0 0 3px #f3a3a3,inset 0 2px 3px rgba(60,20,90,.25)}60%{transform:translateX(-2px)}}
.mult{font:800 13px var(--body);padding:1px 6px;border-radius:999px;background:#eadcf5;color:#5a2b8c}.mult.m2{background:#18a058;color:#fff}.mult.m3{background:linear-gradient(180deg,#ffd76a,#e2a400);color:#5a3300}
.target.flash{animation:tflash .9s}
@keyframes tflash{0%,100%{transform:scale(1)}30%{transform:scale(1.18) rotate(-2deg)}60%{transform:scale(.96)}}
.right{display:grid;justify-items:end;gap:2px}
.score{font:400 26px/1 var(--display);color:#fff;text-shadow:0 2px 0 #5a2b8c,0 4px 10px rgba(0,0,0,.35)}
.hearts{font-size:18px;letter-spacing:2px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.timebar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 70px);height:8px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden;z-index:5}
.timebar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff7ac6,#ffd36e);transition:width .25s linear}
.legend{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:6px;z-index:5;pointer-events:none;flex-wrap:wrap;justify-content:center;width:calc(100% - 24px)}
.legend span{background:rgba(255,255,255,.88);border-radius:999px;padding:3px 9px 3px 4px;font:700 12px var(--body);display:flex;gap:4px;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.legend canvas,.rules canvas{position:static;width:24px;height:24px;display:inline-block}
.legend .p{color:var(--good)}.legend .m{color:var(--bad)}
.overlay{position:fixed;inset:0;display:grid;place-items:center;z-index:10;padding:20px;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.15),rgba(30,8,60,.55))}
.panel{background:var(--card);border-radius:26px;padding:22px 20px 20px;max-width:400px;width:100%;text-align:center;border:5px solid #fff;
  box-shadow:0 2px 0 #f3d9ff,0 30px 60px rgba(30,8,60,.55),inset 0 -6px 0 rgba(160,71,143,.08);animation:pop .6s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}}
.panel h1{font:400 clamp(30px,9vw,40px)/1.05 var(--display);margin:0 0 4px;color:#5a2b8c;text-shadow:0 2px 0 #f3d9ff}
.panel .sub{margin:0 0 14px;color:#7a5a8f;font-size:15px}
.rules{display:grid;gap:8px;text-align:left;margin:0 0 18px}
.rule{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:6px 10px 6px 6px;box-shadow:0 2px 8px rgba(90,43,140,.12)}
.rule .ics{display:flex;align-items:center;min-width:44px;justify-content:center}.rule .ics canvas{width:44px;height:44px}.rule .ics canvas:not(:only-child){width:34px;height:34px;margin-left:-6px}.rule .ics canvas:first-child{margin-left:0}
.v.w{background:#0288d1}
.target b .mult{display:inline-block;font:800 20px var(--body);padding:0 8px;border-radius:999px;background:#eadcf5;color:#5a2b8c}
.target b .mult.m2{background:#18a058;color:#fff}.target b .mult.m3{background:linear-gradient(180deg,#ffd76a,#e2a400);color:#5a3300}
.target b .dots{display:inline-flex;gap:4px;vertical-align:middle;font-size:14px;color:#e2a400}.target b .dots i{width:10px;height:10px;border-radius:50%;background:#eadcf5;display:inline-block}.target b .dots i.on{background:#18a058}
.rule p{margin:0;font-size:14px;line-height:1.3}
.rule .v{font:800 18px var(--body);padding:2px 10px;border-radius:999px;color:#fff}
.v.p{background:var(--good)}.v.m{background:var(--bad)}.v.g{background:linear-gradient(180deg,#ffd76a,#e2a400);color:#5a3300}
.btn{font:800 19px var(--body);border:0;border-radius:16px;padding:14px 30px;color:#fff;cursor:pointer;
  background:linear-gradient(180deg,#ff7ac6,#d83a9a);box-shadow:0 6px 0 #9e1f6c,0 12px 24px rgba(160,30,110,.4)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #9e1f6c,0 6px 14px rgba(160,30,110,.4)}
.btn.ghost{background:#fff;color:#5a2b8c;box-shadow:0 4px 0 #e2cdf2}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.big{font:400 64px/1 var(--display);color:#5a2b8c;margin:6px 0}
.note{color:#7a5a8f;font-size:14px;margin:6px 0 16px}
@media (prefers-reduced-motion:reduce){.panel,.target.flash{animation:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button class="snd" id="snd" aria-pressed="true"></button>
<div class="hud" id="hud" hidden>
  <a class="back" href="./" aria-label="Inicio"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></a>
  <div class="target" id="target"><small id="tLabel">Fase 1 · Salud</small><div class="hrow"><span class="hico">💚</span><div class="hbar" id="hbar"><i id="hFill"></i><s></s></div><span class="hico">🏁</span><span id="mult" class="mult m1">×1</span></div></div>
  <div class="right"><div class="score" id="score">0</div><div class="hearts" id="hearts">❤️❤️❤️</div></div>
</div>
<div class="legend" id="legend" hidden></div>
<div class="overlay" id="start">
  <div class="panel">
    <h1 id="h1">Lluvia de chuches</h1>
    <p class="sub" id="sub">¡Has descubierto el juego secreto! Mueve la bolsa con el dedo.</p>
    <div class="rules" id="rules"></div>
    <div class="btns"><button class="btn" id="play">¡Jugar!</button></div>
  </div>
</div>
<div class="overlay" id="end" hidden>
  <div class="panel">
    <h1 id="eTitle">¡Se acabó!</h1>
    <div class="big" id="eScore">0</div>
    <p class="note" id="eNote"></p>
    <div class="btns"><button class="btn" id="again">Otra vez</button><a class="btn ghost" href="./" id="eHome">Inicio</a></div>
  </div>
</div>
<script src="config.js"></script>
<script src="comun.js"></script>
<script>
const $=id=>document.getElementById(id);
const L=(es,uk)=>KC.lang()==='uk'?uk:es;
const cv=$('cv'),ctx=cv.getContext('2d');let W=0,H=0,DPR=1;
function size(){DPR=Math.min(2.5,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',size);size();
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- sonido ---------- */
let AC=null;
function tone(seq){if(!KC.get('sound',true))return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;
  for(const [f,d,type] of seq){const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;
   g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03);t+=d*.7}}catch(e){}}
const SND={good:()=>tone([[784,.09],[1175,.16]]),bad:()=>tone([[220,.18,'square'],[165,.25,'square']]),gold:()=>tone([[880,.08],[1109,.08],[1319,.08],[1760,.25]]),
  change:()=>tone([[523,.1],[659,.1],[784,.18]]),level:()=>tone([[523,.1],[659,.1],[784,.1],[1047,.35]]),splat:()=>tone([[160,.1,'triangle'],[80,.18,'triangle']]),rip:()=>tone([[700,.05,'sawtooth'],[420,.06,'sawtooth'],[240,.1,'sawtooth'],[120,.3,'sawtooth']]),end:()=>tone([[659,.15],[523,.15],[392,.3]])};


/* ---------- música (se genera en el móvil, no hay archivos) ---------- */
const MUS={on:false,timer:0,step:0,next:0,bpm:118,master:null,mode:'play'};
const ICON_ON='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_OFF='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
const SONG={
  lead:[72,76,79,76,77,76,74,72, 69,72,76,72,74,72,71,69, 65,69,72,77,76,74,72,69, 67,71,74,79,77,74,71,67,
        72,76,79,84,83,79,76,72, 69,72,76,81,79,76,72,69, 65,69,72,77,81,77,72,69, 74,-1,79,-1,77,76,74,71],
  bass:[48,45,41,43,48,45,41,43]};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function ac(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function note(type,f,t,d,vol,dest){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.05);return o}
let NOISE=null;
function hat(t,vol,dest){if(!NOISE){NOISE=AC.createBuffer(1,AC.sampleRate*.1,AC.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NOISE;f.type='highpass';f.frequency.value=7000;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);s.connect(f);f.connect(g);g.connect(dest);s.start(t);s.stop(t+.06)}
function kick(t,dest){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(dest);o.start(t);o.stop(t+.2)}
function schedule(){const e=.5*60/MUS.bpm;while(MUS.next<AC.currentTime+.15){const i=MUS.step%64,t=MUS.next,bar=Math.floor(i/8)%8,b=i%8;
    const m=SONG.lead[i];if(m>0){note('square',mtof(m),t,e*.85,.045,MUS.master);note('triangle',mtof(m+12),t,e*.5,.02,MUS.master)}
    const root=SONG.bass[bar];note('triangle',mtof(b%4===2?root+7:root),t,e*.9,.12,MUS.master);
    if(b%4===0)kick(t,MUS.master);if(b%2===1)hat(t,.06,MUS.master);
    if(b===0&&MUS.step>0){const btn=$('snd');btn.classList.remove('beat');void btn.offsetWidth;btn.classList.add('beat')}
    MUS.next+=e;MUS.step++}}
function musicStart(){if(!KC.get('sound',true)||MUS.on)return;try{ac();MUS.master=AC.createGain();MUS.master.gain.value=.8;MUS.master.connect(AC.destination);
  MUS.on=true;MUS.step=0;MUS.next=AC.currentTime+.08;schedule();MUS.timer=setInterval(schedule,40)}catch(e){}}
function musicStop(fade){if(!MUS.on)return;MUS.on=false;clearInterval(MUS.timer);const g=MUS.master;try{g.gain.setTargetAtTime(.0001,AC.currentTime,fade?.4:.03);setTimeout(()=>g.disconnect(),fade?1600:200)}catch(e){}}
function musicTempo(){MUS.bpm=Math.min(165,118+(G?G.phase-1:0)*8)}
function sadJingle(){if(!KC.get('sound',true))return;try{ac();const t=AC.currentTime+.1;[[67,.0],[66,.35],[65,.7],[64,1.05]].forEach(([m,o],i)=>note('square',mtof(m),t+o,i===3?1.1:.32,.06,AC.destination));
  [[43,0],[42,.35],[41,.7],[40,1.05]].forEach(([m,o],i)=>note('triangle',mtof(m),t+o,i===3?1.1:.32,.14,AC.destination))}catch(e){}}
function paintSnd(){const on=KC.get('sound',true),b=$('snd');b.innerHTML=on?ICON_ON:ICON_OFF;b.setAttribute('aria-pressed',on);b.setAttribute('aria-label',on?L('Música y sonido activados','Музика і звук увімкнені'):L('Música y sonido apagados','Музика і звук вимкнені'))}
$('snd').onclick=()=>{const on=!KC.get('sound',true);KC.set('sound',on);paintSnd();if(on){if(G&&!G.over)musicStart()}else musicStop()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)musicStop();else if(G&&!G.over)musicStart()});
paintSnd();

/* ---------- dibujo: texturas ---------- */
const CANDY=[['#ff5fa2','#c21869'],['#4fc3ff','#1272c4'],['#ffd23f','#d68a00'],['#8ee25d','#2f9a24'],['#b388ff','#6a2fd1'],['#ff8a4c','#d1460f']];
function rr(x,y,w,h,r,c=ctx){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawWrapped(c,x,y,s,rot,col){c.save();c.translate(x,y);c.rotate(rot);
  const [a,b]=col,w=s*1.1,h=s*.78;
  for(const dir of[-1,1]){c.save();c.scale(dir,1);
    const g=c.createLinearGradient(w*.45,0,w*1.05,0);g.addColorStop(0,b);g.addColorStop(1,a);c.fillStyle=g;
    c.beginPath();c.moveTo(w*.42,-h*.18);c.lineTo(w*1.02,-h*.55);c.quadraticCurveTo(w*.9,0,w*1.02,h*.55);c.lineTo(w*.42,h*.18);c.closePath();c.fill();
    c.strokeStyle='rgba(255,255,255,.45)';c.lineWidth=s*.035;c.beginPath();c.moveTo(w*.5,-h*.1);c.lineTo(w*.92,-h*.38);c.moveTo(w*.5,h*.1);c.lineTo(w*.92,h*.38);c.stroke();c.restore()}
  const g=c.createRadialGradient(-w*.15,-h*.25,s*.05,0,0,w*.6);g.addColorStop(0,'#fff');g.addColorStop(.18,a);g.addColorStop(1,b);
  c.fillStyle=g;c.beginPath();c.ellipse(0,0,w*.5,h*.5,0,0,Math.PI*2);c.fill();
  c.save();c.clip();c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=s*.09;for(let i=-3;i<=3;i++){c.beginPath();c.moveTo(i*s*.24-s*.3,-h);c.lineTo(i*s*.24+s*.3,h);c.stroke()}c.restore();
  c.fillStyle='rgba(255,255,255,.7)';c.beginPath();c.ellipse(-w*.18,-h*.22,w*.2,h*.1,-.3,0,Math.PI*2);c.fill();
  c.strokeStyle='rgba(0,0,0,.12)';c.lineWidth=1;c.beginPath();c.ellipse(0,0,w*.5,h*.5,0,0,Math.PI*2);c.stroke();c.restore()}
function drawLolly(c,x,y,s,rot,col){c.save();c.translate(x,y);c.rotate(rot);
  const g0=c.createLinearGradient(-s*.06,0,s*.06,0);g0.addColorStop(0,'#f3efe6');g0.addColorStop(.5,'#fff');g0.addColorStop(1,'#d9d2c3');c.fillStyle=g0;c.fillRect(-s*.05,s*.25,s*.1,s*.7);
  const [a,b]=col,r=s*.5;const g=c.createRadialGradient(-r*.3,-r*.35,r*.1,0,0,r);g.addColorStop(0,'#fff');g.addColorStop(.2,a);g.addColorStop(1,b);
  c.fillStyle=g;c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.fill();
  c.save();c.clip();c.strokeStyle='rgba(255,255,255,.75)';c.lineWidth=r*.16;c.beginPath();for(let t=0;t<14;t+=.1){const rad=r*t/14;c.lineTo(Math.cos(t*1.6)*rad,Math.sin(t*1.6)*rad)}c.stroke();c.restore();
  c.fillStyle='rgba(255,255,255,.65)';c.beginPath();c.ellipse(-r*.35,-r*.4,r*.28,r*.13,-.6,0,Math.PI*2);c.fill();c.restore()}
function drawChoc(c,x,y,s,rot){c.save();c.translate(x,y);c.rotate(rot);const w=s*1.15,h=s*.8;
  c.fillStyle='#4a230c';rr(-w*.46,-h*.5,w*.92,h*.62,s*.06,c);c.fill();
  for(let i=0;i<3;i++)for(let j=0;j<2;j++){const px=-w*.42+i*w*.28,py=-h*.46+j*h*.27;const g2=c.createLinearGradient(px,py,px+w*.24,py+h*.22);g2.addColorStop(0,'#a8683c');g2.addColorStop(.5,'#7a4220');g2.addColorStop(1,'#4a230c');c.fillStyle=g2;rr(px+1,py+1,w*.25,h*.23,3,c);c.fill();
    c.fillStyle='rgba(255,255,255,.18)';c.fillRect(px+3,py+3,w*.2,2)}
  const g=c.createLinearGradient(-w/2,0,w/2,0);g.addColorStop(0,'#8e0f12');g.addColorStop(.3,'#e53935');g.addColorStop(.55,'#ff8a80');g.addColorStop(.7,'#e53935');g.addColorStop(1,'#8e0f12');
  c.fillStyle=g;c.beginPath();c.moveTo(-w/2,-h*.02);for(let i=0;i<=10;i++)c.lineTo(-w/2+i*w/10,-h*.02+(i%2?-h*.06:0));c.lineTo(w/2,h*.5);c.lineTo(-w/2,h*.5);c.closePath();c.fill();
  c.fillStyle='#fff';c.font=`800 ${s*.2}px Figtree,system-ui`;c.textAlign='center';c.textBaseline='middle';c.fillText('CHOCO',0,h*.27);c.restore()}

  if(r<.91)return G.items.push({...base,kind:'pill',word:'la pastilla',type:'pill'});
  if(r<.96)return G.items.push({...base,kind:'water',word:'el agua',type:'water',vr:0});
  G.items.push({...base,kind:'sun',word:'el girasol',type:'sun',vy:v*1.15})}
function addHealth(d){const h=$('hbar');h.classList.remove('up','down');void h.offsetWidth;h.classList.add(d>0?'up':'down');
  G.health=Math.max(0,Math.min(100,G.health+d));paintHud();
  if(G.health>=100)levelUp();else if(G.health<=0)loseLife(L('¡Sin salud!','Без здоров’я!'))}
function levelUp(){G.phase++;musicTempo();G.health=50;const bonus=50*(G.phase-1);G.score+=bonus;SND.level();banner(L(`¡Fase ${G.phase}!  +${bonus}`,`Етап ${G.phase}!  +${bonus}`),'#18a058');
  flash('24,160,88');for(let i=0;i<5;i++)burst(W*(.1+i*.2),H*.3,pick(['#ffd23f','#8ee25d','#4fc3ff','#ff7ac6']),20);G.items=G.items.filter(it=>it.type==='food');G.spawn=1.4;paintHud()}
function loseLife(why){G.lives--;G.combo=0;bag.wob=.8;G.shake=.5;flash('224,48,58');paintHud();
  if(G.lives<=0){gameOver();return}G.health=50;SND.bad();banner(`${why}  −1 ❤️`,'#e0303a');G.items=[];G.spawn=1.4;paintHud()}
function catchIt(it){const y=H-175,m0=mult();
  if(it.type==='food'){G.combo++;const m=mult(),d=10*m;G.score+=d;G.bag.push(it.kind);if(G.bag.length>16)G.bag.shift();SND.good();flash('24,160,88');pop(it.x,y,`+${d} ✓`,true);burst(it.x,H-130,it.pc,20);
    if(m>m0){banner(L(`¡Racha! Puntos ×${m}`,`Серія! Бали ×${m}`),'#18a058');SND.gold()}addHealth(HEAL.food)}
  else if(it.type==='sweet'){G.score=Math.max(0,G.score-10);G.combo=0;SND.bad();flash('224,48,58');pop(it.x,y,L('−10 ¡azúcar!','−10 цукор!'),false);burst(it.x,H-130,it.col[0],10);bag.wob=.4;addHealth(HEAL.sweet)}
  else if(it.type==='pill'){burst(it.x,H-130,'#ff6b6b',14);loseLife(L('¡Pastilla!','Пігулка!'))}
  else if(it.type==='water'){SND.gold();flash('2,136,209');burst(it.x,H-130,'#81d4fa',20);if(G.lives<3){G.lives++;pop(it.x,y,'+1 ❤️',true);paintHud()}else{pop(it.x,y,'+💚',true);addHealth(HEAL.water)}}
  else{G.score+=50;SND.gold();flash('255,200,60');pop(it.x,y,'+50 🌻',true);burst(it.x,H-130,'#ffd23f',26);addHealth(HEAL.sun)}
  const sc=$('score');sc.animate([{transform:'scale(1)'},{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:350});paintHud()}
function squash(it){G.splats.push({x:it.x,y:FLOOR()+10,c:it.pc,kind:it.kind,s:it.s,t:0,seed:Math.random()*99});G.combo=0;SND.splat();
  for(let i=0;i<12;i++){const a=-Math.PI*Math.random(),v=60+Math.random()*160;G.parts.push({x:it.x,y:FLOOR()+6,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,c:it.pc,r:2+Math.random()*3})}
  pop(it.x,FLOOR()-40,L('¡Plaf! −salud','Плюх! −здоров’я'),false);addHealth(HEAL.miss)}
function paintHud(){$('score').textContent=G.score;$('hearts').textContent='❤️'.repeat(Math.max(0,G.lives))+'🤍'.repeat(3-Math.max(0,G.lives));
  $('tLabel').textContent=L(`Fase ${G.phase} · Salud`,`Етап ${G.phase} · Здоров’я`);const f=$('hFill');f.style.width=G.health+'%';
  f.style.background=G.health<25?'linear-gradient(180deg,#ff8a80,#e0303a)':G.health<60?'linear-gradient(180deg,#ffe082,#f0a800)':'linear-gradient(180deg,#b9f6ca,#18a058)';
  const m=mult(),e=$('mult');e.textContent='×'+m;e.className='mult m'+m}
function gameOver(){G.over=true;G.health=0;musicStop(true);sadJingle();const k=G.bag.length?G.bag:['apple','banana','straw','orange'];
  G.end={t:0,x:bag.x,rip:false,halves:[],spill:Array.from({length:Math.min(16,Math.max(8,k.length))},(_,i)=>({kind:k[i%k.length],x:bag.x,y:H-130,vx:(Math.random()-.5)*520,vy:-200-Math.random()*380,r:0,vr:(Math.random()-.5)*10,s:34+Math.random()*12}))};paintHud()}
function updEnd(dt){const E=G.end;E.t+=dt;
  if(E.t>.7&&!E.rip){E.rip=true;SND.rip();G.shake=.4;E.halves=[{dir:-1,x:E.x,y:H-120,vx:-90,vy:-240,r:0,vr:-2.4},{dir:1,x:E.x,y:H-120,vx:90,vy:-200,r:0,vr:2.2}];burst(E.x,H-130,'#e9c48d',30)}
  if(E.rip){for(const h of E.halves){h.vy+=900*dt;h.x+=h.vx*dt;h.y+=h.vy*dt;h.r+=h.vr*dt;if(h.y>FLOOR()+10){h.y=FLOOR()+10;h.vy*=-.25;h.vx*=.6;h.vr*=.5}}
    for(const p of E.spill){p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;if(p.x<20||p.x>W-20){p.vx*=-.7;p.x=Math.max(20,Math.min(W-20,p.x))}if(p.y>FLOOR()+4){p.y=FLOOR()+4;p.vy*=-.38;p.vx*=.75;p.vr*=.6}}}
  if(E.t>1.3&&!E.msg){E.msg=1;banner(L('¡Se rompió la bolsa!','Пакет порвався!'),'#e0303a')}
  if(E.t>3.2&&!E.shown){E.shown=1;showEnd()}}
function step(now){
  let dt=Math.min(.05,(now-last)/1000||0);last=now;
  if(G&&G.end)dt*=.7;
  if(G&&!G.over){G.t+=dt;G.spawn-=dt;if(G.spawn<=0){spawn();G.spawn=every()*(.8+Math.random()*.4)}
    const by=H-130;
    for(const it of G.items){if(G.over)break;it.y+=it.vy*dt;it.rot+=it.vr*dt;it.x+=Math.sin(G.t*2+it.sway)*12*dt;
      if(!it.gone&&it.y>by-10&&it.y<by+40&&Math.abs(it.x-bag.x)<bag.w*.62){it.gone=true;catchIt(it)}
      else if(!it.gone&&it.type==='food'&&it.y>FLOOR()-4){it.gone=true;squash(it)}}
    if(G)G.items=G.items.filter(it=>!it.gone&&it.y<H+80)}
  if(G&&G.end)updEnd(dt);
  if(G){for(const p of G.parts){p.t+=dt;p.vy+=500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}G.parts=G.parts.filter(p=>p.t<1.2);for(const p of G.pops)p.t+=dt;G.pops=G.pops.filter(p=>p.t<(p.big?1.8:1.1));
    for(const sp of G.splats)sp.t+=dt;G.splats=G.splats.filter(sp=>sp.t<5);G.flash=Math.max(0,G.flash-dt);G.shake=Math.max(0,G.shake-dt)}
  bag.wob*=.9;
  draw(now/1000);raf=requestAnimationFrame(step)}
function drawSplat(sp){const a=sp.t<4?1:1-(sp.t-4);const k=Math.min(1,sp.t*8);ctx.save();ctx.globalAlpha=Math.max(0,a);ctx.translate(sp.x,sp.y);
  const R=sp.s*.55*(.6+k*.4);ctx.fillStyle=sp.c;ctx.beginPath();for(let i=0;i<=20;i++){const an=i/20*Math.PI*2,rr2=R*(1+.28*Math.sin(an*5+sp.seed)+.12*Math.sin(an*9+sp.seed*2));ctx.lineTo(Math.cos(an)*rr2,Math.sin(an)*rr2*.32)}ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(0,R*.08,R*.7,R*.14,0,0,7);ctx.fill();
  ctx.fillStyle=sp.c;for(let i=0;i<6;i++){const an=sp.seed+i*1.1;ctx.beginPath();ctx.arc(Math.cos(an)*R*1.5,Math.sin(an)*R*.4,R*.08+(i%3)*R*.03,0,7);ctx.fill()}
  ctx.save();ctx.scale(1,.32);ctx.translate(0,-sp.s*.2);DRAW[sp.kind](ctx,0,0,sp.s*.85,0);ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.ellipse(-R*.3,-R*.08,R*.18,R*.05,0,0,7);ctx.fill();ctx.restore()}
function drawHalf(h,shake){ctx.save();ctx.translate(h.x,h.y);ctx.rotate(h.r);ctx.beginPath();
  if(h.dir<0){ctx.moveTo(-200,-200);ctx.lineTo(0,-200);for(let i=0;i<=10;i++)ctx.lineTo((i%2?7:-7),-60+i*14);ctx.lineTo(0,200);ctx.lineTo(-200,200)}
  else{ctx.moveTo(200,-200);ctx.lineTo(0,-200);for(let i=0;i<=10;i++)ctx.lineTo((i%2?7:-7),-60+i*14);ctx.lineTo(0,200);ctx.lineTo(200,200)}
  ctx.closePath();ctx.clip();drawBag(ctx,0,0,bag.w,bag.h,0);ctx.restore()}
function draw(t){
  if(G&&G.shake>0){ctx.save();ctx.translate((Math.random()-.5)*G.shake*24,(Math.random()-.5)*G.shake*24)}
  drawBg(t);
  if(G){for(const sp of G.splats)drawSplat(sp);
  for(const it of G.items){DRAW[it.kind](ctx,it.x,it.y,it.s,it.rot,it.kind==='sun'?t:it.col);if(it.word)label(ctx,it.x,it.y+it.s*.55,it.word,it.s,it.type==='food'||it.type==='water'||it.type==='sun')}
  if(G.end){const E=G.end;
    if(!E.rip){const k=E.t/.7;ctx.save();ctx.translate(E.x+Math.sin(E.t*70)*k*7,H-120);ctx.scale(1+k*.22,1+k*.12);drawBag(ctx,0,0,bag.w,bag.h,Math.sin(E.t*50)*.08*k);ctx.restore()}
    else{for(const h of E.halves)drawHalf(h);for(const p of E.spill)DRAW[p.kind](ctx,p.x,p.y,p.s,p.r,p.kind==='sun'?0:undefined)}
    const dim=Math.min(.5,Math.max(0,(E.t-1.2)*.3));ctx.fillStyle=`rgba(30,8,60,${dim})`;ctx.fillRect(-30,-30,W+60,H+60)}
  else drawBag(ctx,bag.x,H-120,bag.w,bag.h,Math.sin(t*25)*bag.wob*.4);
  for(const p of G.parts){ctx.globalAlpha=Math.max(0,1-p.t/1.2);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;
  for(const p of G.pops){const life=p.big?1.8:1.1,k=p.t/life;ctx.save();ctx.globalAlpha=Math.max(0,1-k*k*k);ctx.font=`800 ${p.big?32:24}px Figtree,system-ui`;ctx.textAlign='center';ctx.lineWidth=6;ctx.strokeStyle='#fff';
    const y=p.y-(p.big?0:k*60),sc=p.big?1+Math.sin(Math.min(1,k*4)*Math.PI)*.15:1+(1-k)*.15;ctx.translate(p.x,y);ctx.scale(sc,sc);ctx.textBaseline='middle';
    if(p.big){ctx.strokeText(p.txt,0,0);ctx.fillStyle=p.c;ctx.fillText(p.txt,0,0)}
    else{const tw=ctx.measureText(p.txt).width+26,good=p.c==='#18a058';ctx.shadowColor='rgba(0,0,0,.25)';ctx.shadowBlur=8;ctx.shadowOffsetY=3;ctx.fillStyle=good?'#e2f7e8':'#fde4e4';rr(-tw/2,-19,tw,38,19);ctx.fill();ctx.shadowColor='transparent';
      ctx.lineWidth=2.5;ctx.strokeStyle=good?'#8fd9a8':'#f3a3a3';rr(-tw/2,-19,tw,38,19);ctx.stroke();ctx.fillStyle=good?'#0f6b36':'#a3121b';ctx.fillText(p.txt,0,1)}ctx.restore()}
  if(G.flash>0){const a=G.flash/.35*.4;const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,`rgba(${G.flashC},0)`);g.addColorStop(1,`rgba(${G.flashC},${a})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}}
  if(G&&G.shake>0)ctx.restore()}
function endGame(){}
function showEnd(){
  const best=KC.get('chuchesbest',0),rec=G.score>best;if(rec)KC.set('chuchesbest',G.score);const bf=Math.max(KC.get('chuchesfase',1),G.phase);KC.set('chuchesfase',bf);
  const gain=Math.round(G.score/10);if(gain>0)KC.set('pts',KC.get('pts',0)+gain);
  $('eTitle').textContent=rec&&G.score>0?L('¡Nuevo récord! 🍎','Новий рекорд! 🍎'):L('Fin de la partida','Кінець гри');$('eScore').textContent=G.score;
  $('eNote').innerHTML=L(`Has llegado a la <b>fase ${G.phase}</b><br>Récord: ${Math.max(best,G.score)} · Mejor fase: ${bf}<br>+${gain} puntos para tu nivel`,`Ти дійшла до <b>етапу ${G.phase}</b><br>Рекорд: ${Math.max(best,G.score)} · Найкращий етап: ${bf}<br>+${gain} балів до рівня`);
  $('again').textContent=L('Otra vez','Ще раз');$('eHome').textContent=L('Inicio','Головна');$('end').hidden=false}

/* ---------- control ---------- */
function moveTo(x){bag.x=Math.max(bag.w/2,Math.min(W-bag.w/2,x))}
addEventListener('pointerdown',e=>{if(G&&!G.over)moveTo(e.clientX)});
addEventListener('pointermove',e=>{if(G&&!G.over&&(e.buttons||e.pointerType!=='mouse'))moveTo(e.clientX)});
addEventListener('keydown',e=>{if(!G||G.over)return;if(e.key==='ArrowLeft')moveTo(bag.x-40);if(e.key==='ArrowRight')moveTo(bag.x+40)});

/* ---------- reglas con iconos dibujados ---------- */
function icon(kind,size){const c=document.createElement('canvas');const d=Math.min(2.5,devicePixelRatio||1);c.width=size*d;c.height=size*d;const x=c.getContext('2d');x.scale(d,d);
  DRAW[kind](x,size/2,size/2,size*(kind==='water'?.95:kind==='pill'?.8:.64),kind==='pill'?0:-.15,kind==='sun'?0:kind==='wrap'?CANDY[0]:undefined);return c}
function rules(){const R=[[['apple','carrot','straw'],L('Fruta y verdura: dan salud. ¡Si se cae al suelo, se espachurra y pierdes salud!','Фрукти й овочі: додають здоров’я. Якщо впадуть на землю — розчавляться і мінус здоров’я!'),'+💚','p'],
  [['wrap','choc'],L('Chuches y chocolate: quitan salud','Цукерки й шоколад: забирають здоров’я'),'−💚','m'],
  [['pill'],L('Pastilla: pierdes una vida entera','Пігулка: мінус ціле життя'),'−❤️','m'],
  [['water'],L('Agua: recuperas una vida','Вода: повертає життя'),'+❤️','w'],
  [['sun'],L('Girasol: ¡premio de puntos!','Соняшник: приз!'),'+50','g']];
  const box=$('rules');box.innerHTML='';for(const [ks,txt,v,cl] of R){const d=document.createElement('div');d.className='rule';const ic=document.createElement('div');ic.className='ics';ks.forEach(k=>ic.appendChild(icon(k,ks.length>1?34:44)));d.appendChild(ic);
    const p=document.createElement('p');p.innerHTML=txt;d.appendChild(p);const sp=document.createElement('span');sp.className='v '+cl;sp.textContent=v;d.appendChild(sp);box.appendChild(d)}
  const lg=$('legend');lg.innerHTML='';for(const [k,v,cl] of [['apple','+💚','p'],['wrap','−💚','m'],['pill','−❤️','m'],['water','+❤️','p'],['sun','+50','p']]){const s=document.createElement('span');s.appendChild(icon(k,24));const b=document.createElement('b');b.className=cl;b.textContent=v;s.appendChild(b);lg.appendChild(s)}}
function texts(){document.documentElement.lang=KC.lang();$('h1').textContent=L('Lluvia de chuches','Дощ із цукерок');
  $('sub').textContent=L('¡Has descubierto el juego secreto! Mueve la bolsa con el dedo. Llena la barra de salud para pasar de fase; si se vacía, pierdes una de tus 3 vidas.','Ти знайшла секретну гру! Рухай пакет пальцем. Наповни шкалу здоров’я, щоб пройти етап; якщо вона спорожніє — мінус одне з 3 життів.');
  $('play').textContent=L('¡Jugar!','Грати!');document.title=L('Lluvia de chuches','Дощ із цукерок')}
function start(){musicStop();setTimeout(()=>{musicTempo();musicStart()},60);$('start').hidden=true;$('end').hidden=true;$('hud').hidden=false;$('legend').hidden=false;newGame();
  const sec=KC.get('eggs',[]);if(!sec.includes('chuches')){sec.push('chuches');KC.set('eggs',sec);KC.checkBadges()}}
$('play').onclick=start;$('again').onclick=start;
texts();rules();requestAnimationFrame(t=>{last=t;step(t)});
if('serviceWorker' in navigator&&location.protocol!=='file:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
