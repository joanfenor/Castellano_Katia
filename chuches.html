<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#7a3fb0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Lluvia de chuches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600;700;800&display=swap">
<style>
:root{--ink:#2a1640;--card:#fffaf3;--good:#18a058;--bad:#e0303a;--gold:#ffc83d;
  --display:"Young Serif",Georgia,serif;--body:"Figtree",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#3b1d63;font-family:var(--body);color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;pointer-events:none;z-index:5}
.hud>*{pointer-events:auto}
.back{width:44px;height:44px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#5a2b8c;box-shadow:0 4px 12px rgba(40,10,70,.35);text-decoration:none}
.target{justify-self:center;background:linear-gradient(180deg,#fff,#ffeefa);border:3px solid #fff;border-radius:16px;padding:6px 14px;text-align:center;box-shadow:0 6px 18px rgba(40,10,70,.35);max-width:100%}
.target small{display:block;font:800 10.5px var(--body);letter-spacing:.14em;text-transform:uppercase;color:#a0478f}
.target b{display:block;font:400 clamp(18px,5.4vw,24px)/1.1 var(--display);color:#5a2b8c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.target.flash{animation:tflash .9s}
@keyframes tflash{0%,100%{transform:scale(1)}30%{transform:scale(1.18) rotate(-2deg)}60%{transform:scale(.96)}}
.right{display:grid;justify-items:end;gap:2px}
.score{font:400 26px/1 var(--display);color:#fff;text-shadow:0 2px 0 #5a2b8c,0 4px 10px rgba(0,0,0,.35)}
.hearts{font-size:18px;letter-spacing:2px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.timebar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 70px);height:8px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden;z-index:5}
.timebar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff7ac6,#ffd36e);transition:width .25s linear}
.legend{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:6px;z-index:5;pointer-events:none;flex-wrap:wrap;justify-content:center;width:calc(100% - 24px)}
.legend span{background:rgba(255,255,255,.88);border-radius:999px;padding:3px 9px 3px 4px;font:700 12px var(--body);display:flex;gap:4px;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.legend canvas,.rules canvas{position:static;width:24px;height:24px;display:inline-block}
.legend .p{color:var(--good)}.legend .m{color:var(--bad)}
.overlay{position:fixed;inset:0;display:grid;place-items:center;z-index:10;padding:20px;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.15),rgba(30,8,60,.55))}
.panel{background:var(--card);border-radius:26px;padding:22px 20px 20px;max-width:400px;width:100%;text-align:center;border:5px solid #fff;
  box-shadow:0 2px 0 #f3d9ff,0 30px 60px rgba(30,8,60,.55),inset 0 -6px 0 rgba(160,71,143,.08);animation:pop .6s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}}
.panel h1{font:400 clamp(30px,9vw,40px)/1.05 var(--display);margin:0 0 4px;color:#5a2b8c;text-shadow:0 2px 0 #f3d9ff}
.panel .sub{margin:0 0 14px;color:#7a5a8f;font-size:15px}
.rules{display:grid;gap:8px;text-align:left;margin:0 0 18px}
.rule{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:6px 10px 6px 6px;box-shadow:0 2px 8px rgba(90,43,140,.12)}
.rule .ics{display:flex;align-items:center;min-width:44px;justify-content:center}.rule .ics canvas{width:44px;height:44px}.rule .ics canvas:not(:only-child){width:34px;height:34px;margin-left:-6px}.rule .ics canvas:first-child{margin-left:0}
.v.w{background:#0288d1}
.target b .mult{display:inline-block;font:800 20px var(--body);padding:0 8px;border-radius:999px;background:#eadcf5;color:#5a2b8c}
.target b .mult.m2{background:#18a058;color:#fff}.target b .mult.m3{background:linear-gradient(180deg,#ffd76a,#e2a400);color:#5a3300}
.target b .dots{display:inline-flex;gap:4px;vertical-align:middle;font-size:14px;color:#e2a400}.target b .dots i{width:10px;height:10px;border-radius:50%;background:#eadcf5;display:inline-block}.target b .dots i.on{background:#18a058}
.rule p{margin:0;font-size:14px;line-height:1.3}
.rule .v{font:800 18px var(--body);padding:2px 10px;border-radius:999px;color:#fff}
.v.p{background:var(--good)}.v.m{background:var(--bad)}.v.g{background:linear-gradient(180deg,#ffd76a,#e2a400);color:#5a3300}
.btn{font:800 19px var(--body);border:0;border-radius:16px;padding:14px 30px;color:#fff;cursor:pointer;
  background:linear-gradient(180deg,#ff7ac6,#d83a9a);box-shadow:0 6px 0 #9e1f6c,0 12px 24px rgba(160,30,110,.4)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #9e1f6c,0 6px 14px rgba(160,30,110,.4)}
.btn.ghost{background:#fff;color:#5a2b8c;box-shadow:0 4px 0 #e2cdf2}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.big{font:400 64px/1 var(--display);color:#5a2b8c;margin:6px 0}
.note{color:#7a5a8f;font-size:14px;margin:6px 0 16px}
@media (prefers-reduced-motion:reduce){.panel,.target.flash{animation:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud" id="hud" hidden>
  <a class="back" href="./" aria-label="Inicio"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></a>
  <div class="target" id="target"><small id="tLabel">Come sano</small><b id="tName"></b></div>
  <div class="right"><div class="score" id="score">0</div><div class="hearts" id="hearts">❤️❤️❤️</div></div>
</div>
<div class="timebar" id="timebar" hidden><i id="tFill"></i></div>
<div class="legend" id="legend" hidden></div>
<div class="overlay" id="start">
  <div class="panel">
    <h1 id="h1">Lluvia de chuches</h1>
    <p class="sub" id="sub">¡Has descubierto el juego secreto! Mueve la bolsa con el dedo.</p>
    <div class="rules" id="rules"></div>
    <div class="btns"><button class="btn" id="play">¡Jugar!</button></div>
  </div>
</div>
<div class="overlay" id="end" hidden>
  <div class="panel">
    <h1 id="eTitle">¡Se acabó!</h1>
    <div class="big" id="eScore">0</div>
    <p class="note" id="eNote"></p>
    <div class="btns"><button class="btn" id="again">Otra vez</button><a class="btn ghost" href="./" id="eHome">Inicio</a></div>
  </div>
</div>
<script src="config.js"></script>
<script src="comun.js"></script>
<script>
const $=id=>document.getElementById(id);
const L=(es,uk)=>KC.lang()==='uk'?uk:es;
const cv=$('cv'),ctx=cv.getContext('2d');let W=0,H=0,DPR=1;
function size(){DPR=Math.min(2.5,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',size);size();
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- sonido ---------- */
let AC=null;
function tone(seq){if(!KC.get('sound',true))return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;
  for(const [f,d,type] of seq){const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;
   g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03);t+=d*.7}}catch(e){}}
const SND={good:()=>tone([[784,.09],[1175,.16]]),bad:()=>tone([[220,.18,'square'],[165,.25,'square']]),gold:()=>tone([[880,.08],[1109,.08],[1319,.08],[1760,.25]]),
  change:()=>tone([[523,.1],[659,.1],[784,.18]]),end:()=>tone([[659,.15],[523,.15],[392,.3]])};

/* ---------- dibujo: texturas ---------- */
const CANDY=[['#ff5fa2','#c21869'],['#4fc3ff','#1272c4'],['#ffd23f','#d68a00'],['#8ee25d','#2f9a24'],['#b388ff','#6a2fd1'],['#ff8a4c','#d1460f']];
function rr(x,y,w,h,r,c=ctx){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawWrapped(c,x,y,s,rot,col){c.save();c.translate(x,y);c.rotate(rot);
  const [a,b]=col,w=s*1.1,h=s*.78;
  for(const dir of[-1,1]){c.save();c.scale(dir,1);
    const g=c.createLinearGradient(w*.45,0,w*1.05,0);g.addColorStop(0,b);g.addColorStop(1,a);c.fillStyle=g;
    c.beginPath();c.moveTo(w*.42,-h*.18);c.lineTo(w*1.02,-h*.55);c.quadraticCurveTo(w*.9,0,w*1.02,h*.55);c.lineTo(w*.42,h*.18);c.closePath();c.fill();
    c.strokeStyle='rgba(255,255,255,.45)';c.lineWidth=s*.035;c.beginPath();c.moveTo(w*.5,-h*.1);c.lineTo(w*.92,-h*.38);c.moveTo(w*.5,h*.1);c.lineTo(w*.92,h*.38);c.stroke();c.restore()}
  const g=c.createRadialGradient(-w*.15,-h*.25,s*.05,0,0,w*.6);g.addColorStop(0,'#fff');g.addColorStop(.18,a);g.addColorStop(1,b);
  c.fillStyle=g;c.beginPath();c.ellipse(0,0,w*.5,h*.5,0,0,Math.PI*2);c.fill();
  c.save();c.clip();c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=s*.09;for(let i=-3;i<=3;i++){c.beginPath();c.moveTo(i*s*.24-s*.3,-h);c.lineTo(i*s*.24+s*.3,h);c.stroke()}c.restore();
  c.fillStyle='rgba(255,255,255,.7)';c.beginPath();c.ellipse(-w*.18,-h*.22,w*.2,h*.1,-.3,0,Math.PI*2);c.fill();
  c.strokeStyle='rgba(0,0,0,.12)';c.lineWidth=1;c.beginPath();c.ellipse(0,0,w*.5,h*.5,0,0,Math.PI*2);c.stroke();c.restore()}
function drawLolly(c,x,y,s,rot,col){c.save();c.translate(x,y);c.rotate(rot);
  const g0=c.createLinearGradient(-s*.06,0,s*.06,0);g0.addColorStop(0,'#f3efe6');g0.addColorStop(.5,'#fff');g0.addColorStop(1,'#d9d2c3');c.fillStyle=g0;c.fillRect(-s*.05,s*.25,s*.1,s*.7);
  const [a,b]=col,r=s*.5;const g=c.createRadialGradient(-r*.3,-r*.35,r*.1,0,0,r);g.addColorStop(0,'#fff');g.addColorStop(.2,a);g.addColorStop(1,b);
  c.fillStyle=g;c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.fill();
  c.save();c.clip();c.strokeStyle='rgba(255,255,255,.75)';c.lineWidth=r*.16;c.beginPath();for(let t=0;t<14;t+=.1){const rad=r*t/14;c.lineTo(Math.cos(t*1.6)*rad,Math.sin(t*1.6)*rad)}c.stroke();c.restore();
  c.fillStyle='rgba(255,255,255,.65)';c.beginPath();c.ellipse(-r*.35,-r*.4,r*.28,r*.13,-.6,0,Math.PI*2);c.fill();c.restore()}
function drawChoc(c,x,y,s,rot){c.save();c.translate(x,y);c.rotate(rot);const w=s*1.15,h=s*.8;
  c.fillStyle='#4a230c';rr(-w*.46,-h*.5,w*.92,h*.62,s*.06,c);c.fill();
  for(let i=0;i<3;i++)for(let j=0;j<2;j++){const px=-w*.42+i*w*.28,py=-h*.46+j*h*.27;const g2=c.createLinearGradient(px,py,px+w*.24,py+h*.22);g2.addColorStop(0,'#a8683c');g2.addColorStop(.5,'#7a4220');g2.addColorStop(1,'#4a230c');c.fillStyle=g2;rr(px+1,py+1,w*.25,h*.23,3,c);c.fill();
    c.fillStyle='rgba(255,255,255,.18)';c.fillRect(px+3,py+3,w*.2,2)}
  const g=c.createLinearGradient(-w/2,0,w/2,0);g.addColorStop(0,'#8e0f12');g.addColorStop(.3,'#e53935');g.addColorStop(.55,'#ff8a80');g.addColorStop(.7,'#e53935');g.addColorStop(1,'#8e0f12');
  c.fillStyle=g;c.beginPath();c.moveTo(-w/2,-h*.02);for(let i=0;i<=10;i++)c.lineTo(-w/2+i*w/10,-h*.02+(i%2?-h*.06:0));c.lineTo(w/2,h*.5);c.lineTo(-w/2,h*.5);c.closePath();c.fill();
  c.fillStyle='#fff';c.font=`800 ${s*.2}px Figtree,system-ui`;c.textAlign='center';c.textBaseline='middle';c.fillText('CHOCO',0,h*.27);c.restore()}
function star(c,x,y,r){c.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rr2=i%2?r*.35:r;c.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2)}c.closePath();c.fill()}
function drawBroc(c,x,y,s,rot){c.save();c.translate(x,y);c.rotate(rot);
  const gs=c.createLinearGradient(-s*.15,0,s*.15,0);gs.addColorStop(0,'#9ccc65');gs.addColorStop(.5,'#c5e1a5');gs.addColorStop(1,'#7cb342');c.fillStyle=gs;
  c.beginPath();c.moveTo(-s*.14,0);c.lineTo(-s*.2,s*.55);c.quadraticCurveTo(0,s*.65,s*.2,s*.55);c.lineTo(s*.14,0);c.fill();
  const bl=[[-.3,-.05,.26],[.3,-.05,.26],[0,-.2,.3],[-.18,-.35,.22],[.2,-.36,.22],[0,.02,.24]];
  for(const [bx,by,br] of bl){const g=c.createRadialGradient(bx*s-br*s*.3,by*s-br*s*.3,br*s*.1,bx*s,by*s,br*s);g.addColorStop(0,'#8bd35d');g.addColorStop(.6,'#3f8f2a');g.addColorStop(1,'#245c16');
    c.fillStyle=g;c.beginPath();c.arc(bx*s,by*s,br*s,0,Math.PI*2);c.fill();
    c.fillStyle='rgba(20,60,10,.35)';for(let k=0;k<6;k++){const a=k*1.05;c.beginPath();c.arc(bx*s+Math.cos(a)*br*s*.55,by*s+Math.sin(a)*br*s*.55,br*s*.12,0,Math.PI*2);c.fill()}}
  c.fillStyle='#1d3a12';c.beginPath();c.arc(-s*.1,-s*.08,s*.035,0,7);c.arc(s*.1,-s*.08,s*.035,0,7);c.fill();
  c.fillStyle='rgba(255,120,140,.55)';c.beginPath();c.arc(-s*.18,s*.0,s*.05,0,7);c.arc(s*.18,s*.0,s*.05,0,7);c.fill();
  c.strokeStyle='#1d3a12';c.lineWidth=s*.03;c.lineCap='round';c.beginPath();c.arc(0,-s*.02,s*.07,Math.PI*.15,Math.PI*.85);c.stroke();c.restore()}
function leafAt(c,x,y,len,ang){c.save();c.translate(x,y);c.rotate(ang);const g=c.createLinearGradient(0,0,len,0);g.addColorStop(0,'#2e7d32');g.addColorStop(1,'#8bc34a');c.fillStyle=g;
  c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(len*.5,-len*.42,len,0);c.quadraticCurveTo(len*.5,len*.42,0,0);c.fill();c.strokeStyle='rgba(20,70,10,.45)';c.lineWidth=Math.max(1,len*.05);c.beginPath();c.moveTo(len*.05,0);c.lineTo(len*.85,0);c.stroke();c.restore()}
function gloss(c,x,y,rx,ry,a){c.fillStyle='rgba(255,255,255,.6)';c.beginPath();c.ellipse(x,y,rx,ry,a,0,Math.PI*2);c.fill()}
function drawApple(c,x,y,s,rot){c.save();c.translate(x,y);c.rotate(rot);const r=s*.48;
  const g=c.createRadialGradient(-r*.35,-r*.3,r*.08,0,r*.1,r*1.15);g.addColorStop(0,'#ff9e9a');g.addColorStop(.35,'#e53935');g.addColorStop(.85,'#a3151a');g.addColorStop(1,'#6d0b0e');c.fillStyle=g;
  c.beginPath();c.moveTo(0,-r*.62);c.bezierCurveTo(r*.6,-r*1.1,r*1.25,-r*.5,r*.95,r*.35);c.bezierCurveTo(r*.75,r*1.0,r*.25,r*1.02,0,r*.85);c.bezierCurveTo(-r*.25,r*1.02,-r*.75,r*1.0,-r*.95,r*.35);c.bezierCurveTo(-r*1.25,-r*.5,-r*.6,-r*1.1,0,-r*.62);c.fill();
  c.fillStyle='rgba(255,230,150,.35)';for(let i=0;i<14;i++){const a=i*2.4,d=r*(.3+(i%4)*.15);c.beginPath();c.arc(Math.cos(a)*d,Math.sin(a)*d*.9+r*.1,r*.025,0,7);c.fill()}
  c.strokeStyle='#5d3a1a';c.lineWidth=s*.06;c.lineCap='round';c.beginPath();c.moveTo(0,-r*.55);c.quadraticCurveTo(r*.05,-r*.95,r*.18,-r*1.1);c.stroke();
  leafAt(c,r*.12,-r*.95,r*.6,-.45);gloss(c,-r*.45,-r*.2,r*.14,r*.3,.35);c.restore()}
function drawBanana(c,x,y,s,rot){c.save();c.translate(x,y);c.rotate(rot-.2);
  const g=c.createLinearGradient(0,-s*.3,0,s*.4);g.addColorStop(0,'#fff59d');g.addColorStop(.45,'#fdd835');g.addColorStop(1,'#e8a400');c.fillStyle=g;
  c.beginPath();c.moveTo(-s*.55,-s*.22);c.quadraticCurveTo(-s*.05,s*.62,s*.55,-s*.28);c.quadraticCurveTo(s*.25,-s*.12,s*.0,-s*.02);c.quadraticCurveTo(-s*.3,-s*.05,-s*.48,-s*.26);c.closePath();c.fill();
  c.strokeStyle='rgba(150,100,0,.55)';c.lineWidth=s*.025;c.stroke();
  c.strokeStyle='rgba(180,120,0,.5)';c.beginPath();c.moveTo(-s*.45,-s*.15);c.quadraticCurveTo(-s*.02,s*.42,s*.47,-s*.22);c.stroke();
  c.strokeStyle='rgba(255,255,255,.65)';c.lineWidth=s*.04;c.lineCap='round';c.beginPath();c.moveTo(-s*.3,s*.04);c.quadraticCurveTo(-s*.05,s*.24,s*.2,s*.09);c.stroke();
  c.fillStyle='#4e3418';c.beginPath();c.ellipse(-s*.53,-s*.24,s*.05,s*.035,.6,0,7);c.fill();c.fillStyle='#6d8b2a';c.beginPath();c.moveTo(s*.52,-s*.26);c.lineTo(s*.64,-s*.4);c.lineTo(s*.58,-s*.22);c.closePath();c.fill();c.restore()}
function drawCarrot(c,x,y,s,rot){c.save();c.translate(x,y);c.rotate(rot+.35);
  for(const [a,l] of [[-.5,.42],[0,.5],[.5,.42]])leafAt(c,0,-s*.3,s*l,-Math.PI/2+a);
  const g=c.createLinearGradient(-s*.22,0,s*.22,0);g.addColorStop(0,'#d84315');g.addColorStop(.4,'#ffab40');g.addColorStop(.7,'#fb8c00');g.addColorStop(1,'#bf360c');c.fillStyle=g;
  c.beginPath();c.moveTo(-s*.22,-s*.28);c.quadraticCurveTo(0,-s*.4,s*.22,-s*.28);c.quadraticCurveTo(s*.14,s*.2,0,s*.58);c.quadraticCurveTo(-s*.14,s*.2,-s*.22,-s*.28);c.fill();
  c.strokeStyle='rgba(150,50,0,.5)';c.lineWidth=s*.025;c.lineCap='round';for(const [yy,w,dx] of [[-.12,.12,-.05],[.05,.09,.04],[.2,.07,-.03],[.34,.05,.02]]){c.beginPath();c.moveTo((dx-w)*s,yy*s);c.lineTo((dx+w*.4)*s,yy*s+2);c.stroke()}
  gloss(c,-s*.1,-s*.12,s*.04,s*.14,.1);c.restore()}
function drawStraw(c,x,y,s,rot){c.save();c.translate(x,y);c.rotate(rot);
  const g=c.createRadialGradient(-s*.12,-s*.08,s*.04,0,s*.05,s*.55);g.addColorStop(0,'#ff8a80');g.addColorStop(.45,'#e53935');g.addColorStop(1,'#9b0d16');c.fillStyle=g;

/* ---------- juego ---------- */
let G=null,raf=0,last=0;
const bag={x:0,w:96,h:96,wob:0,vx:0};
const FOOD=[['apple','la manzana','#e53935'],['banana','el plátano','#fdd835'],['carrot','la zanahoria','#fb8c00'],['straw','la fresa','#e53935'],['orange','la naranja','#ffa726'],['broc','el brócoli','#43a047'],['grapes','las uvas','#8e24aa']];
const SWEET=[['wrap','la chuche'],['lolly','la piruleta'],['choc','el chocolate']];
const DRAW={apple:drawApple,banana:drawBanana,carrot:drawCarrot,straw:drawStraw,orange:drawOrange,grapes:drawGrapes,broc:(c,x,y,s,r)=>drawBroc(c,x,y,s*1.05,r),
  wrap:(c,x,y,s,r,col)=>drawWrapped(c,x,y,s,r,col||CANDY[0]),lolly:(c,x,y,s,r,col)=>drawLolly(c,x,y,s,r,col||CANDY[1]),choc:drawChoc,pill:drawPill,water:drawWater,sun:drawSun};
const mult=()=>G.combo>=10?3:G.combo>=5?2:1;
function newGame(){G={t:0,score:0,lives:3,combo:0,items:[],parts:[],pops:[],spawn:0,dur:75,flash:0,flashC:''};bag.x=W/2;paintHud()}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function spawn(){const r=Math.random(),s=Math.max(48,Math.min(66,W*.14)),x=s*.8+Math.random()*(W-1.6*s);
  const speed=(55+Math.min(G.t,75)*1.3)*(.85+Math.random()*.3);const base={x,y:-s,s,rot:(Math.random()-.5)*.6,vr:(Math.random()-.5)*1.0,vy:speed,sway:Math.random()*6};
  if(r<.5){const [k,w,col]=pick(FOOD);return G.items.push({...base,kind:k,word:w,type:'food',pc:col})}
  if(r<.78){const [k,w]=pick(SWEET);return G.items.push({...base,kind:k,word:w,type:'sweet',col:pick(CANDY)})}
  if(r<.89)return G.items.push({...base,kind:'pill',word:'la pastilla',type:'pill'});
  if(r<.95)return G.items.push({...base,kind:'water',word:'el agua',type:'water',vr:0});
  G.items.push({...base,kind:'sun',word:'el girasol',type:'sun',vy:speed*1.15})}
function catchIt(it){
  let d=0,txt='',c='',hurt=false;const m0=mult();
  if(it.type==='food'){G.combo++;const m=mult();d=10*m;txt=`+${d} ✓`;c='#18a058';SND.good();
    if(m>m0){G.pops.push({x:W/2,y:H*.36,txt:L(`¡Racha! Puntos ×${m}`,`Серія! Бали ×${m}`),c:'#18a058',t:0,big:true});SND.gold()}}
  else if(it.type==='sweet'){d=-10;txt=L('−10 ¡azúcar!','−10 цукор!');c='#e0303a';SND.bad();if(G.combo>=5)txt+=' ×1';G.combo=0}
  else if(it.type==='pill'){txt=L('−1 ❤️ ¡pastilla!','−1 ❤️ пігулка!');c='#e0303a';hurt=true;G.combo=0;SND.bad()}
  else if(it.type==='water'){if(G.lives<3){G.lives++;txt='+1 ❤️';}else{d=20;txt='+20 💧'}c='#0288d1';SND.gold()}
  else{d=50;txt='+50 🌻';c='#e2a400';SND.gold()}
  G.score=Math.max(0,G.score+d);if(hurt){G.lives--;bag.wob=.6}
  const pos=d>0||it.type==='water';G.flash=.35;G.flashC=pos?(it.type==='water'?'2,136,209':'24,160,88'):'224,48,58';
  const stack=G.pops.filter(q=>!q.big&&q.t<.6).length;G.pops.push({x:Math.max(100,Math.min(W-100,it.x)),y:H-170-stack*50,txt,c,t:0});
  const sc=$('score');sc.style.color=pos?'#8dffb4':'#ffb0b5';sc.animate([{transform:'scale(1)'},{transform:'scale(1.5)'},{transform:'scale(1)'}],{duration:400});setTimeout(()=>sc.style.color='',450);
  const pc=it.pc||(it.col?it.col[0]:it.type==='water'?'#81d4fa':it.type==='sun'?'#ffd23f':'#ff6b6b');
  const n=pos?22:12;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=80+Math.random()*220;G.parts.push({x:it.x,y:H-130,vx:Math.cos(a)*v,vy:Math.sin(a)*v-120,t:0,c:pc,r:2+Math.random()*3})}

function paintHud(){$('score').textContent=G.score;$('hearts').textContent='❤️'.repeat(Math.max(0,G.lives))+'🤍'.repeat(3-Math.max(0,G.lives));$('tFill').style.width=Math.max(0,100-G.t/G.dur*100)+'%';
  const m=mult(),nx=m===1?5:m===2?10:0;$('tLabel').textContent=L('Come sano','Їж корисне');
  $('tName').innerHTML=`<span class="mult m${m}">×${m}</span> <span class="dots">${nx?Array.from({length:5},(_,i)=>`<i class="${i<(G.combo-(m===2?5:0))?'on':''}"></i>`).join(''):'★★★'}</span>`}
function step(now){
  const dt=Math.min(.05,(now-last)/1000||0);last=now;
  if(G&&!G.over){G.t+=dt;G.spawn-=dt;if(G.spawn<=0){spawn();G.spawn=Math.max(.55,1.0-G.t*.006)}
    if(G.t>=G.dur){endGame()}
    const by=H-130;
    for(const it of G.items){it.y+=it.vy*dt;it.rot+=it.vr*dt;it.x+=Math.sin(G.t*2+it.sway)*12*dt;
      if(!it.gone&&it.y>by-10&&it.y<by+40&&Math.abs(it.x-bag.x)<bag.w*.62){it.gone=true;catchIt(it)}}
    G.items=G.items.filter(it=>!it.gone&&it.y<H+80);
    if(Math.floor(G.t*4)!==Math.floor((G.t-dt)*4))paintHud()}
  if(G){for(const p of G.parts){p.t+=dt;p.vy+=500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}G.parts=G.parts.filter(p=>p.t<1.2);for(const p of G.pops)p.t+=dt;G.pops=G.pops.filter(p=>p.t<(p.big?1.6:1.1));G.flash=Math.max(0,G.flash-dt)}

  for(const p of G.pops){const k=p.t/(p.big?1.6:1.1);ctx.save();ctx.globalAlpha=1-k*k;ctx.font=`800 ${p.big?34:28}px Figtree`;ctx.textAlign='center';ctx.lineWidth=6;ctx.strokeStyle='#fff';
    const y=p.y-(p.big?0:k*70),sc=p.big?1+Math.sin(Math.min(1,k*4)*Math.PI)*.15:1+(1-k)*.2;ctx.translate(p.x,y);ctx.scale(sc,sc);ctx.textBaseline='middle';
    if(p.big){ctx.strokeText(p.txt,0,0);ctx.fillStyle=p.c;ctx.fillText(p.txt,0,0)}
    else{const tw=ctx.measureText(p.txt).width+28;ctx.shadowColor='rgba(0,0,0,.3)';ctx.shadowBlur=10;ctx.shadowOffsetY=3;ctx.fillStyle=p.c;rr(-tw/2,-22,tw,44,22);ctx.fill();ctx.shadowColor='transparent';
      ctx.lineWidth=3;ctx.strokeStyle='#fff';rr(-tw/2,-22,tw,44,22);ctx.stroke();ctx.fillStyle='#fff';ctx.fillText(p.txt,0,1)}ctx.restore()}
  if(G.flash>0){const a=G.flash/.35*.45;const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,`rgba(${G.flashC},0)`);g.addColorStop(1,`rgba(${G.flashC},${a})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}}
function endGame(){if(G.over)return;G.over=true;SND.end();
  const best=KC.get('chuchesbest',0),rec=G.score>best;if(rec)KC.set('chuchesbest',G.score);
  const gain=Math.round(G.score/10);if(gain>0)KC.set('pts',KC.get('pts',0)+gain);
  $('eTitle').textContent=rec&&G.score>0?L('¡Nuevo récord! 🍎','Новий рекорд! 🍎'):L('¡Se acabó!','Кінець!');$('eScore').textContent=G.score;
  $('eNote').textContent=L(`Récord: ${Math.max(best,G.score)} · +${gain} puntos para tu nivel`,`Рекорд: ${Math.max(best,G.score)} · +${gain} балів до рівня`);
  $('again').textContent=L('Otra vez','Ще раз');$('eHome').textContent=L('Inicio','Головна');

/* ---------- control ---------- */
function moveTo(x){bag.x=Math.max(bag.w/2,Math.min(W-bag.w/2,x))}
addEventListener('pointerdown',e=>{if(G&&!G.over)moveTo(e.clientX)});
addEventListener('pointermove',e=>{if(G&&!G.over&&(e.buttons||e.pointerType!=='mouse'))moveTo(e.clientX)});
addEventListener('keydown',e=>{if(!G||G.over)return;if(e.key==='ArrowLeft')moveTo(bag.x-40);if(e.key==='ArrowRight')moveTo(bag.x+40)});

function rules(){const R=[[['apple','carrot','straw'],L('Fruta y verdura. ¡Con 5 seguidas los puntos valen ×2 y con 10, ×3!','Фрукти й овочі. 5 поспіль — бали ×2, 10 поспіль — ×3!'),'+10','p'],

  [['water'],L('Agua: recuperas una vida','Вода: повертає життя'),'+❤️','w'],
  [['sun'],L('Girasol: ¡premio!','Соняшник: приз!'),'+50','g']];
  const box=$('rules');box.innerHTML='';for(const [ks,txt,v,cl] of R){const d=document.createElement('div');d.className='rule';const ic=document.createElement('div');ic.className='ics';ks.forEach(k=>ic.appendChild(icon(k,ks.length>1?34:44)));d.appendChild(ic);
    const p=document.createElement('p');p.innerHTML=txt;d.appendChild(p);const sp=document.createElement('span');sp.className='v '+cl;sp.textContent=v;d.appendChild(sp);box.appendChild(d)}
  const lg=$('legend');lg.innerHTML='';for(const [k,v,cl] of [['apple','+10','p'],['wrap','−10','m'],['pill','−❤️','m'],['water','+❤️','p'],['sun','+50','p']]){const s=document.createElement('span');s.appendChild(icon(k,24));const b=document.createElement('b');b.className=cl;b.textContent=v;s.appendChild(b);lg.appendChild(s)}}
function texts(){document.documentElement.lang=KC.lang();$('h1').textContent=L('Lluvia de chuches','Дощ із цукерок');
  $('sub').textContent=L('¡Has descubierto el juego secreto! Mueve la bolsa con el dedo y llénala de comida sana. ¡Cuidado con las chuches!','Ти знайшла секретну гру! Рухай пакет пальцем і наповнюй його корисною їжею. Обережно з цукерками!');
  $('play').textContent=L('¡Jugar!','Грати!');document.title=L('Lluvia de chuches','Дощ із цукерок')}
function start(){$('start').hidden=true;$('end').hidden=true;$('hud').hidden=false;$('timebar').hidden=false;$('legend').hidden=false;newGame();
  const sec=KC.get('eggs',[]);if(!sec.includes('chuches')){sec.push('chuches');KC.set('eggs',sec);KC.checkBadges()}}
$('play').onclick=start;$('again').onclick=start;
texts();rules();requestAnimationFrame(t=>{last=t;step(t)});
if('serviceWorker' in navigator&&location.protocol!=='file:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
