<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3f8fd8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Jardín de girasoles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600;700;800&display=swap">
<style>
:root{--ink:#1d2a3a;--card:#fffdf5;--display:"Young Serif",Georgia,serif;--body:"Figtree",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#7cc0ff;font-family:var(--body);color:var(--ink);-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.top{position:fixed;left:0;right:0;top:0;z-index:5;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
.back{width:44px;height:44px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#2a5f9e;box-shadow:0 4px 12px rgba(0,40,90,.3);text-decoration:none}
.ttl{background:rgba(255,255,255,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:3px solid #fff;border-radius:18px;padding:6px 14px;box-shadow:0 6px 18px rgba(0,40,90,.22);min-width:0}
.ttl h1{font:400 clamp(19px,5.6vw,24px)/1.1 var(--display);margin:0;color:#7a4a00}
.ttl p{margin:2px 0 0;font:600 13px var(--body);color:#56708c}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:5;background:rgba(255,255,255,.9);border-radius:999px;padding:7px 14px;font:700 13px var(--body);color:#3d5a2a;box-shadow:0 3px 10px rgba(0,0,0,.18);white-space:nowrap;max-width:calc(100% - 28px);overflow:hidden;text-overflow:ellipsis}
.empty{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:4;width:min(340px,calc(100% - 32px));background:rgba(255,253,245,.94);border:4px solid #fff;border-radius:22px;padding:18px;text-align:center;box-shadow:0 18px 40px rgba(0,40,90,.25)}
.empty h2{font:400 22px var(--display);margin:0 0 6px;color:#7a4a00}.empty p{margin:0;color:#56708c;line-height:1.45}
.card{position:fixed;z-index:10;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);transform:translateX(-50%);width:min(340px,calc(100% - 32px));
  background:var(--card);border:4px solid #ffd23f;border-radius:22px;padding:14px 16px;box-shadow:0 20px 40px rgba(0,40,90,.3);display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;animation:up .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes up{from{transform:translate(-50%,-24px);opacity:0}}
.card .es{font:400 26px/1.15 var(--display);color:#1d2a3a;overflow-wrap:anywhere}
.card .uk{grid-column:1;color:#56708c;font-size:16px}
.card .k{grid-column:1/-1;font:800 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:#c48a00}
.card .say{grid-column:2;grid-row:2/4;width:48px;height:48px;border-radius:50%;border:0;background:linear-gradient(180deg,#ffd84a,#e2a400);color:#5a3300;box-shadow:0 4px 0 #b07c00;display:grid;place-items:center;cursor:pointer}
.card .dots{grid-column:1/-1;display:flex;gap:4px;margin-top:4px}.card .dots i{width:9px;height:9px;border-radius:50%;background:#e8e2cf}.card .dots i.on{background:#f0b400}

[hidden]{display:none!important}
.ttl p{display:flex;flex-wrap:wrap;gap:2px 10px}.ttl p .nb{color:#3a2a40;font-weight:800}
.ttl small{display:block;margin-top:3px;font:600 11px/1.3 var(--body);color:#7a8ea3}
.card.black,.card.quiz{border-color:#3a3236}.card.white{border-color:#e8e0cc}.card.crown{border-color:#0057b7}
.card.day .es{font-size:22px}.card .big{grid-column:2;grid-row:2/4;font-size:40px;line-height:1}
.card.quiz{display:block;text-align:center}.card.quiz .k{display:block;margin-bottom:4px}
.card .q{display:block;font:400 21px/1.25 var(--display);margin:2px 0 10px}.card .q b{font-weight:400;color:#5a2b8c}
.opts{display:grid;gap:7px}
.opts button{font:700 16px var(--body);padding:11px;border-radius:14px;border:2px solid #e8e2cf;background:#fff;color:#1d2a3a;cursor:pointer;box-shadow:0 3px 0 #e8e2cf}
.opts button.ok{background:#e2f7e8;border-color:#8fd9a8;color:#0f6b36}
.opts button.ko{background:#fde4e4;border-color:#f3a3a3;color:#a3121b;animation:no .4s}
@keyframes no{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.practice{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:6;font:800 14px var(--body);border:0;border-radius:999px;padding:11px 18px;color:#fff;background:linear-gradient(180deg,#4a4048,#1f1a1e);box-shadow:0 4px 0 #000,0 8px 18px rgba(0,0,0,.3);cursor:pointer;white-space:nowrap;max-width:calc(100% - 28px);overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="top">
  <a class="back" href="./" aria-label="Inicio"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></a>
  <div class="ttl"><h1 id="h1">Tu jardín</h1><p id="count"></p><small id="legend"></small></div>
</div>
<div class="empty" id="empty" hidden><h2 id="eH">Tu jardín está esperando</h2><p id="eP"></p></div>
<button class="practice" id="practice" hidden></button>
<div class="card" id="card" hidden></div>
<script src="config.js"></script>
<script src="comun.js"></script>
<script src="palabras.js"></script>
<script>
const $=id=>document.getElementById(id);const cv=$('cv'),ctx=cv.getContext('2d');let W=0,H=0,DPR=1;
/* ---------- semilla estable ---------- */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rnd(seed){let x=seed||1;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return((x>>>0)%100000)/100000}}

/* ---------- sprites con textura (se dibujan una vez) ---------- */
const PET=[['#ffe066','#f5a300','#c47a00'],['#ffd23f','#f08c00','#b35f00'],['#fff08a','#f7b500','#cf8a00']];
function headSprite(v,S=200){const c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');const R=S/2,cx=R,cy=R;const [p0,p1,p2]=PET[v];
  for(const layer of[0,1]){const n=layer?21:21,len=R*(layer?.82:.95),wid=R*(layer?.17:.19),off=layer?Math.PI/n:0;
    for(let i=0;i<n;i++){const a=i/n*Math.PI*2+off;x.save();x.translate(cx,cy);x.rotate(a);
      const g=x.createLinearGradient(R*.3,0,len,0);g.addColorStop(0,layer?p2:p1);g.addColorStop(.45,layer?p1:p0);g.addColorStop(1,layer?p0:p1);x.fillStyle=g;
      x.beginPath();x.moveTo(R*.3,0);x.bezierCurveTo(R*.45,-wid,len*.82,-wid*.9,len,0);x.bezierCurveTo(len*.82,wid*.9,R*.45,wid,R*.3,0);x.fill();
      x.strokeStyle='rgba(150,80,0,.25)';x.lineWidth=S*.004;x.beginPath();x.moveTo(R*.36,0);x.lineTo(len*.92,0);x.stroke();x.restore()}}
  const g=x.createRadialGradient(cx-R*.08,cy-R*.1,R*.02,cx,cy,R*.42);g.addColorStop(0,'#8a5a2b');g.addColorStop(.6,'#5a3417');g.addColorStop(1,'#2e1808');
  x.fillStyle=g;x.beginPath();x.arc(cx,cy,R*.42,0,Math.PI*2);x.fill();
  const GA=Math.PI*(3-Math.sqrt(5));for(let i=0;i<260;i++){const r=R*.4*Math.sqrt(i/260),a=i*GA;const sx=cx+Math.cos(a)*r,sy=cy+Math.sin(a)*r;
    x.fillStyle=i<40?'#b07a3a':i%2?'#3a2010':'#6e4520';x.beginPath();x.arc(sx,sy,R*.022*(1-r/(R*.5))+R*.006,0,Math.PI*2);x.fill()}
  x.fillStyle='rgba(255,255,255,.12)';x.beginPath();x.ellipse(cx-R*.12,cy-R*.15,R*.18,R*.1,-.5,0,Math.PI*2);x.fill();return c}
function budSprite(S=80){const c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');const R=S/2;
  const g=x.createRadialGradient(R*.8,R*.7,R*.1,R,R,R*.6);g.addColorStop(0,'#a6dc6a');g.addColorStop(1,'#3d8a22');x.fillStyle=g;
  x.beginPath();x.ellipse(R,R,R*.42,R*.55,0,0,Math.PI*2);x.fill();x.fillStyle='#ffd23f';for(let i=-2;i<=2;i++){x.beginPath();x.ellipse(R+i*R*.14,R*.5,R*.08,R*.2,i*.25,0,Math.PI*2);x.fill()}
  x.strokeStyle='rgba(30,80,10,.5)';x.lineWidth=2;x.beginPath();x.moveTo(R,R*.5);x.quadraticCurveTo(R*.7,R,R,R*1.5);x.stroke();return c}
function daisySprite(col,S=60){const c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');const R=S/2;
  for(let i=0;i<10;i++){x.save();x.translate(R,R);x.rotate(i/10*Math.PI*2);const g=x.createLinearGradient(0,0,R*.9,0);g.addColorStop(0,'#fff');g.addColorStop(1,col);x.fillStyle=g;x.beginPath();x.ellipse(R*.5,0,R*.42,R*.15,0,0,Math.PI*2);x.fill();x.restore()}
  const g=x.createRadialGradient(R*.9,R*.9,1,R,R,R*.25);g.addColorStop(0,'#fff6a0');g.addColorStop(1,'#f0a800');x.fillStyle=g;x.beginPath();x.arc(R,R,R*.24,0,Math.PI*2);x.fill();return c}
const HEADS=[0,1,2].map(v=>headSprite(v)),BUD=budSprite(),DAISY=['#ffffff','#ffb3d9','#c9b3ff','#9fd6ff'].map(c=>daisySprite(c));

function paintGround(g,w,h){const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#8fd14f');gr.addColorStop(.35,'#5cb338');gr.addColorStop(1,'#2f7d1e');g.fillStyle=gr;
  g.beginPath();g.moveTo(0,30);for(let x=0;x<=w;x+=20)g.lineTo(x,30+Math.sin(x*.012)*14+Math.sin(x*.031)*6);g.lineTo(w,h);g.lineTo(0,h);g.fill();
  const r=rnd(5);for(let i=0;i<w*h/28;i++){const x=r()*w,y=30+r()*(h-30),d=y/h;g.strokeStyle=`hsla(${95+r()*30},${50+r()*20}%,${22+r()*30+(1-d)*10}%,.55)`;g.lineWidth=.6+d*1.4;
    g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+(r()-.5)*4,y-3-d*8,x+(r()-.5)*6,y-5-d*14);g.stroke()}
  for(let i=0;i<60;i++){const x=r()*w,y=40+r()*(h-40);g.fillStyle=['#fff','#ffe066','#ff9ec7'][i%3];g.globalAlpha=.7;g.beginPath();g.arc(x,y,1.2+r()*1.6,0,7);g.fill()}g.globalAlpha=1}
function hills(t){const g=ctx.createLinearGradient(0,HOR-80,0,HOR+20);g.addColorStop(0,'#9ccfa0');g.addColorStop(1,'#6fae6a');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,HOR+10);
  for(let x=0;x<=W;x+=16)ctx.lineTo(x,HOR-30-Math.sin(x*.006+1)*30-Math.sin(x*.017)*10);ctx.lineTo(W,HOR+10);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(0,HOR-6,W,16)}
function sky(t){const g=ctx.createLinearGradient(0,0,0,HOR);g.addColorStop(0,'#3f8fd8');g.addColorStop(.7,'#9fd3ff');g.addColorStop(1,'#fff1c4');ctx.fillStyle=g;ctx.fillRect(0,0,W,HOR+40);
  const sx=W*.82,sy=H*.16;ctx.save();ctx.translate(sx,sy);ctx.rotate(t*.05);ctx.fillStyle='rgba(255,236,150,.25)';for(let i=0;i<12;i++){ctx.rotate(Math.PI/6);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W*.6,-18);ctx.lineTo(W*.6,18);ctx.fill()}ctx.restore();
  const s=ctx.createRadialGradient(sx,sy,4,sx,sy,60);s.addColorStop(0,'#fffbe0');s.addColorStop(.45,'#ffd84a');s.addColorStop(.5,'rgba(255,210,70,.6)');s.addColorStop(1,'rgba(255,210,70,0)');ctx.fillStyle=s;ctx.beginPath();ctx.arc(sx,sy,60,0,7);ctx.fill();
  for(const c of clouds){const x=((c.x+t*c.v)%(W+200))-100;cloud(x,c.y,c.s)}}
function cloud(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);const g=ctx.createLinearGradient(0,-30,0,20);g.addColorStop(0,'#fff');g.addColorStop(1,'#dbe9f7');ctx.fillStyle=g;ctx.beginPath();
  ctx.arc(-30,0,20,0,7);ctx.arc(0,-12,28,0,7);ctx.arc(30,-2,22,0,7);ctx.arc(55,6,14,0,7);ctx.rect(-30,0,85,20);ctx.fill();ctx.restore()}
function leaf(x,y,dir,s){ctx.save();ctx.translate(x,y);ctx.scale(dir,1);const g=ctx.createLinearGradient(0,0,s,-s*.4);g.addColorStop(0,'#2f7d1e');g.addColorStop(1,'#7cc04a');ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(s*.5,-s*.55,s,-s*.25);ctx.quadraticCurveTo(s*.5,s*.15,0,0);ctx.fill();ctx.strokeStyle='rgba(20,60,10,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(s*.85,-s*.25);ctx.stroke();ctx.restore()}
/* ===== lana con textura (sprites) ===== */
function woolSprite(black,S=180){const c=document.createElement('canvas');c.width=S;c.height=S*.82;const x=c.getContext('2d');
  const P=black?{hi:'#77717d',mid:'#3a3540',lo:'#141117',curl:'rgba(255,255,255,.10)',curlD:'rgba(0,0,0,.35)',shine:'rgba(255,255,255,.10)'}
               :{hi:'#ffffff',mid:'#f4efe4',lo:'#cbbfa8',curl:'rgba(255,255,255,.9)',curlD:'rgba(150,128,96,.32)',shine:'rgba(255,255,255,.75)'};
  const r=rnd(21),cx=S*.5,cy=S*.44,rx=S*.36,ry=S*.3;
  /* silueta: una sola forma con bordes ondulados */
  const bumps=[];const N=22;for(let i=0;i<N;i++){const a=i/N*Math.PI*2;bumps.push([cx+Math.cos(a)*rx*.9,cy+Math.sin(a)*ry*.88,S*(.075+r()*.03)])}
  x.fillStyle='#000';x.beginPath();x.ellipse(cx,cy,rx*.95,ry*.92,0,0,7);x.fill();for(const [px,py,pr] of bumps){x.beginPath();x.arc(px,py,pr,0,7);x.fill()}
  /* volumen general (solo dentro de la silueta) */
  x.globalCompositeOperation='source-in';const g=x.createRadialGradient(cx-rx*.35,cy-ry*.55,S*.03,cx,cy+ry*.1,rx*1.25);g.addColorStop(0,P.hi);g.addColorStop(.5,P.mid);g.addColorStop(1,P.lo);x.fillStyle=g;x.fillRect(0,0,S,S);
  x.globalCompositeOperation='source-atop';
  /* sombra suave en la barriga */
  const b=x.createLinearGradient(0,cy,0,cy+ry*1.2);b.addColorStop(0,'rgba(0,0,0,0)');b.addColorStop(1,black?'rgba(0,0,0,.45)':'rgba(120,95,60,.35)');x.fillStyle=b;x.fillRect(0,cy,S,S);
  /* cada bulto de lana con su luz y su sombra */
  for(const [px,py,pr] of bumps){const gg=x.createRadialGradient(px-pr*.35,py-pr*.4,pr*.05,px,py,pr*1.05);gg.addColorStop(0,black?'rgba(255,255,255,.14)':'rgba(255,255,255,.85)');gg.addColorStop(.7,'rgba(255,255,255,0)');gg.addColorStop(1,black?'rgba(0,0,0,.25)':'rgba(140,115,80,.22)');x.fillStyle=gg;x.beginPath();x.arc(px,py,pr,0,7);x.fill()}
  /* rizos interiores */
  for(let i=0;i<46;i++){const a=r()*Math.PI*2,d=Math.sqrt(r())*.82;const px=cx+Math.cos(a)*rx*d,py=cy+Math.sin(a)*ry*d,rr=S*(.016+r()*.016),a0=r()*6;
    x.lineWidth=S*.011;x.lineCap='round';x.strokeStyle=P.curlD;x.beginPath();x.arc(px+S*.003,py+S*.004,rr,a0,a0+4);x.stroke();
    x.strokeStyle=P.curl;x.lineWidth=S*.007;x.beginPath();x.arc(px,py,rr,a0+.3,a0+2.2);x.stroke()}
  /* brillo superior */
  const sh=x.createRadialGradient(cx-rx*.3,cy-ry*.6,0,cx-rx*.3,cy-ry*.6,rx*.6);sh.addColorStop(0,P.shine);sh.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=sh;x.fillRect(0,0,S,S);
  x.globalCompositeOperation='source-over';return c}
const WOOL={black:woolSprite(true),white:woolSprite(false)};

function drawSheep(sh,t){const s=sh.sc*58,x=sh.x,y=sh.y-sh.hop,dir=sh.dir,k=sh.k;/* k: 0 negra → 1 blanca */
  const walking=sh.state==='walk',ph=t*11+sh.ph;
  ctx.fillStyle='rgba(20,60,10,.28)';ctx.beginPath();ctx.ellipse(x,sh.y,s*.55,s*.12,0,0,7);ctx.fill();
  ctx.save();ctx.translate(x,y);ctx.scale(dir,1);
  /* patas */
  const lc=k>.5?'#d9aca6':'#2a2326';const lx=[-.28,-.12,.12,.28];lx.forEach((l,i)=>{const sw=walking?Math.sin(ph+i*Math.PI)*s*.07:0;ctx.save();ctx.translate(l*s*.9,-s*.26);ctx.rotate(sw/s*2.2);const lg=ctx.createLinearGradient(-s*.045,0,s*.045,0);lg.addColorStop(0,lc);lg.addColorStop(.5,k>.5?'#f0cbc5':'#4a4044');lg.addColorStop(1,lc);ctx.fillStyle=lg;ctx.beginPath();ctx.roundRect(-s*.045,0,s*.09,s*.25,s*.04);ctx.fill();ctx.fillStyle='#2a1f1c';ctx.beginPath();ctx.roundRect(-s*.05,s*.2,s*.1,s*.065,[s*.01,s*.01,s*.03,s*.03]);ctx.fill();ctx.restore()});
  /* cuerpo */
  const bob=walking?Math.abs(Math.sin(ph))*s*.04:Math.sin(t*1.5+sh.ph)*s*.01;const bw=s*1.2,bh=bw*.82,by=-s*.22-bh*.86-bob;
  if(k<1){ctx.drawImage(WOOL.black,-bw/2,by,bw,bh)}
  if(k>0){ctx.globalAlpha=k;ctx.drawImage(WOOL.white,-bw/2,by,bw,bh);ctx.globalAlpha=1}
  /* cola */
  ctx.fillStyle=k>.5?'#efe9dc':'#2e2a33';ctx.beginPath();ctx.arc(-bw*.41,-s*.62-bob+Math.sin(t*6+sh.ph)*s*.02,s*.08,0,7);ctx.fill();
  /* cabeza */
  const graze=sh.state==='graze'?1:0;sh.gz+=(graze-sh.gz)*.08;const bleat=sh.bleat>0?1:0;
  ctx.save();ctx.translate(bw*.45,-s*.74-bob+sh.gz*s*.4-bleat*s*.08);ctx.rotate(sh.gz*.9-bleat*.35+(sh.sad>0?.5:0));
  const pink=k>.5;const hd=ctx.createRadialGradient(-s*.02,-s*.05,s*.02,s*.04,s*.02,s*.24);
  if(pink){hd.addColorStop(0,'#fdeae6');hd.addColorStop(.6,'#f4cdc6');hd.addColorStop(1,'#dda59d')}else{hd.addColorStop(0,'#3a3236');hd.addColorStop(1,'#151012')}
  /* orejas */
  const ew=Math.sin(t*3+sh.ph)*.25+(sh.bleat>0?.4:0);
  for(const [ex,ang] of [[-.08,-1.9-ew],[.02,-1.3+ew]]){ctx.save();ctx.translate(ex*s,-s*.08);ctx.rotate(ang);ctx.fillStyle=pink?'#efc2bb':'#2a2326';ctx.beginPath();ctx.ellipse(s*.13,0,s*.13,s*.055,0,0,7);ctx.fill();ctx.fillStyle=pink?'#e5a0a4':'rgba(255,150,170,.45)';ctx.beginPath();ctx.ellipse(s*.13,0,s*.085,s*.028,0,0,7);ctx.fill();ctx.restore()}
  ctx.fillStyle=hd;ctx.beginPath();ctx.ellipse(s*.06,s*.02,s*.2,s*.15,.35,0,7);ctx.fill();
  if(pink){ctx.strokeStyle='rgba(190,120,112,.45)';ctx.lineWidth=s*.012;ctx.stroke()}
  /* mechón de lana en la frente */
  ctx.drawImage(pink?WOOL.white:WOOL.black,-s*.18,-s*.25,s*.34,s*.26);
  /* ojo */
  const blink=(Math.sin(t*.9+sh.ph*3)>.985)?.15:1;
  if(!pink){ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(s*.08,-s*.03,s*.045,s*.05,0,0,7);ctx.fill()}
  ctx.fillStyle=pink?'#2b1c1e':'#111';ctx.beginPath();ctx.ellipse(s*.095,-s*.025,s*.028,s*.034*blink,0,0,7);ctx.fill();

function dayCard(f){const c=$('card');c.className='card day';const d=new Date(f.day+'T12:00:00');
  let ds=d.toLocaleDateString(KC.lang()==='uk'?'uk-UA':'es-ES',{weekday:'long',day:'numeric',month:'long'});ds=ds.charAt(0).toUpperCase()+ds.slice(1);const n=f.n,g=KC.GOAL;
  const msg=n>=g?L('¡Meta del día cumplida! 🌻','Мету дня виконано! 🌻'):L(`Faltaron ${g-n} para la meta`,`До мети забракло ${g-n}`);
  c.innerHTML=`<span class="k">${L('Día de práctica','День практики')}</span><span class="es">${ds}</span><span class="uk">${L(`${n} aciertos`,`${n} правильних`)} · ${msg}</span><span class="big">${n>=g?'🌻':n>=10?'🌼':'🌱'}</span>`;show(c)}
function quiz(sh){const c=$('card');c.className='card quiz';const others=Object.keys(UK).filter(w=>w!==sh.w&&UK[w]!==UK[sh.w]);const pick=()=>UK[others[Math.floor(Math.random()*others.length)]];
  let o2=pick(),o3=pick();while(o3===o2)o3=pick();const opts=[UK[sh.w],o2,o3].sort(()=>Math.random()-.5);
  c.innerHTML=`<span class="k">${L('Rescata la oveja negra','Врятуй чорну вівцю')} 🐑</span><span class="q">${L('¿Qué significa','Що означає')} <b>${sh.w}</b>?</span><div class="opts">${opts.map(o=>`<button lang="uk">${o}</button>`).join('')}</div>`;show(c);
  c.querySelectorAll('.opts button').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const ok=b.textContent===UK[sh.w];
    c.querySelectorAll('.opts button').forEach(x=>{x.disabled=true;if(x.textContent===UK[sh.w])x.classList.add('ok')});
    const s=ST[sh.w]||[0,0];if(ok){s[0]=Math.min(5,s[0]+1)}else{s[0]=0;s[1]++}ST[sh.w]=s;saveST();
    if(ok){if(!demo)KC.hit();c.querySelector('.k').textContent=L('¡Correcto! Mira tu oveja… ✨','Правильно! Подивись на вівцю… ✨');
      setTimeout(()=>{c.hidden=true;sel=sh;sh.black=false;sh.anim={type:'rescue',t:0};sh.bleat=1.6;sh.vy=320;sh.state='idle';sh.timer=4;burst(sh.x,sh.y-40,'#fff',30);sh.msg=2.2;sh.msgT=null;counts();
        if(!demo){const seen=KC.get('jardinseen',{});seen[sh.w]='white';KC.set('jardinseen',seen)}setTimeout(()=>{if(sel===sh)sel=null},2200)},700)}
    else{b.classList.add('ko');sh.sad=1.4;sh.bleat=1.4;c.querySelector('.k').textContent=L('Casi… sigue negra. ¡Otra vez será!','Майже… ще чорна. Наступного разу!');setTimeout(()=>{if(sel===sh){c.hidden=true;sel=null}},2200)}})}
const nBlack=()=>sheep.filter(s=>s.black).length;
function counts(){const st=WORDS.map(x=>stateOf(x.w)),bl=st.filter(x=>x==='black').length,cr=st.filter(x=>x==='crown').length,wh=st.filter(x=>x==='white').length;
  $('count').innerHTML=`<span>🌻 ${F.length} ${L(F.length===1?'día':'días','днів')}</span><span>👑 ${cr}</span><span>⚪ ${wh}</span><span class="nb">⚫ ${bl}</span>`;
  $('practice').hidden=!bl;$('practice').textContent=L(`🐑 Practicar mis ${bl} ovejas negras`,`🐑 Повторити ${bl} чорних овець`)}
$('practice').onclick=()=>{try{localStorage.setItem('kvoc-topic',JSON.stringify('hard'))}catch(e){}location.href='vocabulario.html'};
function texts(){document.documentElement.lang=KC.lang();document.title=L('Jardín de girasoles','Сад соняшників');$('h1').textContent=L('Tu jardín','Твій сад');
  $('legend').innerHTML=L('🌻 cada día que practicas · 🐑 cada palabra: ⚫ difícil, ⚪ aprendiendo, 👑 dominada','🌻 кожен день практики · 🐑 кожне слово: ⚫ складне, ⚪ вивчаєш, 👑 вивчене');
  $('eH').textContent=L('Tu jardín está esperando','Твій сад чекає');
  $('eP').textContent=L('Cada día que practiques crecerá un girasol, y cada palabra que estudies en Vocabulario será una oveja de tu rebaño.','Кожного дня практики виростатиме соняшник, а кожне слово зі «Слів» стане вівцею у твоїй отарі.');
  $('empty').hidden=!!(F.length||sheep.length||herd.length)}
addEventListener('resize',()=>{layout();sel=null;$('card').hidden=true});
layout();texts();requestAnimationFrame(loop);
{const sec=KC.get('eggs',[]);if(!sec.includes('jardin')){sec.push('jardin');KC.set('eggs',sec);KC.checkBadges()}}
if('serviceWorker' in navigator&&location.protocol!=='file:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
