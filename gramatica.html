<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
.theory{margin-bottom:14px}
.theory summary{font:400 22px var(--display);cursor:pointer;list-style-position:inside}
.theory p{margin:10px 0 0;font-size:15.5px;line-height:1.5;max-width:70ch}
.why{margin-top:6px;font-weight:500;color:var(--ink);font-size:15px}
.feedback .say{margin-left:8px}
.say{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--tile);border-radius:8px;width:34px;height:30px;cursor:pointer;display:inline-grid;place-items:center;vertical-align:middle}
.say svg{width:16px;height:16px}
#viewD .options{grid-template-columns:repeat(2,minmax(0,1fr))}
.dialog{margin-bottom:14px}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dhead h2{font:400 clamp(26px,6vw,34px)/1.1 var(--display);margin:0}
.lines{display:grid;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:9px 12px;max-width:88%;justify-self:start}
.line.me{justify-self:end;background:var(--tile-soft);border-color:transparent;border-radius:14px 14px 4px 14px}
.line.now{outline:3px solid var(--saffron)}
.line .who{grid-column:1;font-size:12px;font-weight:700;color:var(--tile);letter-spacing:.04em}
.line .txt{grid-column:1;font-size:16px;line-height:1.4}
.line .say{grid-column:2;grid-row:1 / span 2}
.qh{font:400 24px var(--display);margin:0 0 10px}
.sq{margin-bottom:14px}.sqq{font-weight:600;margin:0 0 8px;font-size:16px}
.sq .opt{font-size:16px;padding:11px 14px}
</style>
<title>Dudas y situaciones</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>

/* Layout: azulejo-patterned header band, then two tabs — "Conjugar" (verb chips + tense tables) and "Practicar" (exercise card + settings). */
:root{
  --bg:#f3f5fa; --card:#ffffff; --ink:#1b2a4a; --muted:#5d6a85; --line:#d9deec;
  --tile:#2747a8; --tile-soft:#e3e9fb; --saffron:#e3a020; --saffron-soft:#fdf1d6;
  --ok:#2c8657; --ok-soft:#e1f3e9; --bad:#c13d36; --bad-soft:#fbe5e3;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1528; --card:#171f3b; --ink:#e7ebf7; --muted:#9ba6c3; --line:#2a3459;
  --tile:#86a2ff; --tile-soft:#1f2a52; --saffron:#f0b94a; --saffron-soft:#3a2f17;
  --ok:#5fd095; --ok-soft:#173627; --bad:#ff8a80; --bad-soft:#3c1d1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1528; --card:#171f3b; --ink:#e7ebf7; --muted:#9ba6c3; --line:#2a3459;
  --tile:#86a2ff; --tile-soft:#1f2a52; --saffron:#f0b94a; --saffron-soft:#3a2f17;
  --ok:#5fd095; --ok-soft:#173627; --bad:#ff8a80; --bad-soft:#3c1d1d; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0057b7 0 50%,#ffd700 50% 100%)}
header .wrap{padding-block:16px 28px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between}
.hello{background:var(--card);border-radius:16px;padding:16px 22px;box-shadow:0 6px 24px rgba(0,30,80,.18);min-width:0}
.stats{background:var(--card);border-radius:16px;padding:10px;box-shadow:0 6px 24px rgba(0,30,80,.18)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,46px);line-height:1.05;margin:6px 0 6px;text-wrap:balance}
h1 em{font-style:normal;color:var(--tile)}
.sub{color:var(--muted);margin:0;max-width:52ch}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:92px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat span{font-size:12px;color:var(--muted)}

nav.tabs{display:flex;gap:6px;margin:22px 0 18px}
.tab{font:600 15px var(--body);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 18px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--tile);border-color:var(--tile);color:var(--card)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}

/* Conjugar */
.search{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search input{font:inherit;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:min(280px,100%)}
.groups{display:grid;gap:12px;margin-bottom:22px}
.group h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 15px var(--body);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
.chip:hover{border-color:var(--tile)}
.chip[aria-pressed="true"]{background:var(--tile-soft);border-color:var(--tile);color:var(--tile);font-weight:700}

.verbhead{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:baseline;padding:18px 0 14px;border-top:2px solid var(--ink)}
.verbhead h2{font-family:var(--display);font-weight:400;font-size:clamp(34px,7vw,52px);margin:0;line-height:1}
.verbhead .gloss{color:var(--muted);font-size:17px}
.forms{display:flex;gap:18px;flex-wrap:wrap;font-size:15px}
.forms span{color:var(--muted)}
.forms b{font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 14px}
.legend i{font-style:normal;color:var(--tile);font-weight:700}
.legend .irr{color:var(--saffron);font-weight:700}

.mood{margin:8px 0 22px}
.mood > h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 10px}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.t{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.t h4{margin:0;font-size:15px;font-weight:700}
.t p.use{margin:2px 0 10px;font-size:13px;color:var(--muted);line-height:1.35}
.t table{width:100%;border-collapse:collapse;font-size:15px}
.t td{padding:4px 0;border-top:1px dashed var(--line);vertical-align:baseline}
.t td.p{color:var(--muted);font-size:13px;width:44%;padding-right:8px}
.t td.f{font-weight:500}
.f .end{color:var(--tile);font-weight:700}
.f .aux{color:var(--muted);font-weight:400}
.f.irr{position:relative}
.f.irr::after{content:"●";color:var(--saffron);font-size:9px;margin-left:6px;vertical-align:middle}
.compound .t{background:transparent}

/* Practicar */
.practice{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:820px){.practice{grid-template-columns:1fr}}
.modes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pill{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--tile-soft);color:var(--tile);font-weight:600}
.pill.s{background:var(--saffron-soft);color:var(--ink)}
.q{font-family:var(--display);font-size:clamp(25px,6.5vw,32px);line-height:1.25;margin:0 0 6px;text-wrap:balance}
.q .blank{display:inline-block;min-width:4ch;border-bottom:3px solid var(--saffron);color:var(--tile)}
.qhint{color:var(--muted);margin:0 0 16px;font-size:15px}
.answer{display:flex;gap:8px;flex-wrap:wrap}
.answer input{flex:1 1 220px;min-width:0;font:500 19px var(--body);padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{font:700 15px var(--body);padding:12px 18px;border-radius:10px;border:0;background:var(--tile);color:var(--card);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.accents{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.accents button{font:600 16px var(--body);width:38px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:460px){.options{grid-template-columns:1fr}}
.opt{font:500 18px var(--body);text-align:left;padding:14px 16px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--tile)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.feedback{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:15px}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.no{background:var(--bad-soft);color:var(--bad)}
.feedback.almost{background:var(--saffron-soft);color:var(--ink)}
.feedback b{font-weight:800;font-size:1.25em}
.feedback{margin:0 0 14px!important}
.next{margin-top:14px;display:flex;justify-content:flex-end}

aside.settings{display:grid;gap:16px}
.settings h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.settings select{font:inherit;width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.checks{display:grid;gap:4px;font-size:14px}
.checks label{display:flex;gap:8px;align-items:center;cursor:pointer}
.checks .mlabel{font-size:12px;color:var(--muted);margin-top:6px;font-weight:600}
.minis{display:flex;gap:8px;margin-top:6px}
.minis button{font:600 12px var(--body);background:none;border:0;color:var(--tile);cursor:pointer;padding:0;text-decoration:underline}
.note{font-size:13px;color:var(--muted);line-height:1.45}
#exercise{position:relative;overflow:hidden;min-height:300px}
.card.good{box-shadow:0 0 0 3px var(--ok),0 12px 34px rgba(44,134,87,.25)}
.card.shake{box-shadow:0 0 0 3px var(--bad)}
.floatpts{position:absolute;left:50%;top:14px;transform:translateX(-50%);font:400 34px var(--display);color:var(--ok);pointer-events:none;white-space:nowrap;opacity:0}
.levelbar{margin-bottom:12px}
.lvl{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:700;margin-bottom:6px;align-items:center;flex-wrap:wrap}
.lvl .pts{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.bar,.tbar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i,.tbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0057b7,#ffd700);border-radius:99px;transition:width .5s ease}
.tbar{margin-bottom:8px}.tbar i{transition:width .2s linear}
.tbar.hurry i{background:var(--bad)}
.combo{display:inline-block;background:#ffd700;color:#0b2a66;border-radius:99px;padding:2px 10px;font-weight:800;font-size:13px;margin-left:8px}
.tinfo{display:flex;justify-content:space-between;font-weight:600;margin-bottom:12px;font-variant-numeric:tabular-nums}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.burst{position:fixed;inset:0;display:grid;place-items:center;z-index:40;background:rgba(0,40,110,.4);padding:16px;cursor:pointer}
.burst-inner{background:var(--card);border-radius:24px;padding:28px 36px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);border:5px solid #ffd700;max-width:420px}
.burst .big{font:400 clamp(44px,11vw,76px)/1 var(--display);color:var(--tile);margin-bottom:8px}
.intro{text-align:center;padding:6px 0}
.intro .q{margin-top:6px}
.btn.big{font-size:20px;padding:16px 36px;margin-top:6px}
.count{font:400 130px/1 var(--display);text-align:center;color:var(--tile);padding:50px 0}
.result-big{font:400 84px/1 var(--display);color:var(--tile);text-align:center;margin-top:8px}
.opt kbd{font:600 12px var(--body);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px;margin-right:10px;vertical-align:2px}
.linkbtn{font:600 13px var(--body);background:none;border:0;color:var(--tile);cursor:pointer;padding:0;text-decoration:underline}
@media (prefers-reduced-motion:no-preference){
 .card.shake{animation:shake .4s}
 @keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
 .card.good{animation:glow .5s}
 @keyframes glow{40%{transform:scale(1.015)}}
 .floatpts{animation:floatup 1.1s ease-out forwards}
 @keyframes floatup{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}20%{opacity:1;transform:translate(-50%,-4px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
 .combo{animation:pulse .9s infinite}
 @keyframes pulse{50%{transform:scale(1.12)}}
 .burst-inner,.count,.result-big{animation:zoom .55s cubic-bezier(.2,1.6,.4,1)}
 @keyframes zoom{from{transform:scale(.3);opacity:0}}
}
@media (prefers-reduced-motion:reduce){.floatpts{opacity:1}}
.qverb{font:400 clamp(44px,12vw,60px)/1 var(--display);margin:6px 0 8px;overflow-wrap:anywhere}
.qperson{font:700 clamp(21px,5.8vw,26px)/1.2 var(--body);color:var(--tile);margin:0 0 10px}
@media (max-width:600px){
 .card{padding:18px}
 .qhint{font-size:16px}
 .opt{font-size:21px;padding:16px}
 .answer input{font-size:21px;padding:14px}
 .btn{font-size:17px;padding:14px 20px}
 .accents button{width:44px;height:42px;font-size:18px}
 .pill{font-size:14px}
 .stat{min-width:0;flex:1 1 70px;padding:6px 10px}
 .stat b{font-size:20px}
}
.langrow{flex-basis:100%;display:flex;justify-content:flex-end}
.lang{display:inline-flex;gap:4px;background:var(--card);padding:4px;border-radius:999px;box-shadow:0 4px 16px rgba(0,30,80,.18)}
.lang button{font:700 14px var(--body);border:0;background:transparent;color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--tile);color:var(--card)}
.selinfo{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:-4px 0 10px}
.selinfo b{color:var(--ink)}
.hud{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;margin-bottom:12px}
.hud .levelbar{margin:0}
.face{width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--tile-soft),var(--card) 72%);border:3px solid var(--line);overflow:hidden;flex:none;transition:border-color .3s}
.face svg{display:block;width:100%;height:100%}
.face.m3,.face.m2{border-color:#ffd700}.face.m-2,.face.m-3{border-color:var(--bad)}
.face .eyes{transform-box:fill-box;transform-origin:center}
@media (max-width:600px){.face{width:84px;height:84px}.hud{gap:12px}}
@media (prefers-reduced-motion:no-preference){
 .face .eyes.blink{animation:blink 4.6s infinite}
 @keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
 .face.hop{animation:hop .55s cubic-bezier(.3,1.8,.5,1)}
 @keyframes hop{30%{transform:translateY(-10px) rotate(-4deg)}60%{transform:translateY(0) rotate(3deg)}}
 .face.nope{animation:nope .5s}
 @keyframes nope{20%{transform:rotate(-9deg)}45%{transform:rotate(8deg)}70%{transform:rotate(-4deg)}}
 .face .spark{animation:spark 1.4s infinite;transform-box:fill-box;transform-origin:center}
 @keyframes spark{50%{transform:scale(.5);opacity:.4}}
 .face .tear{animation:tear 1.6s infinite}
 @keyframes tear{0%{transform:translateY(-3px);opacity:0}30%{opacity:1}100%{transform:translateY(9px);opacity:0}}
}
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:linear-gradient(180deg,#0057b7 0 50%,#ffd700 50% 100%);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:pointer;transition:opacity .6s ease,visibility .6s}
.splash.out{opacity:0;visibility:hidden}
.splash-card{background:var(--card);border-radius:28px;padding:28px 28px 22px;max-width:400px;width:100%;text-align:center;box-shadow:0 24px 70px rgba(0,25,70,.35)}
.splash-face{width:180px;height:180px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 40%,var(--tile-soft),var(--card) 72%);border:6px solid #ffd700;box-shadow:0 0 0 6px #0057b7;display:block;margin:0 auto 18px}
.splash h2{font:400 clamp(36px,10vw,48px)/1.05 var(--display);margin:0 0 10px;color:var(--ink)}
.splash h2 em{font-style:normal;color:var(--tile)}
.splash p{font-size:18px;line-height:1.45;color:var(--muted);margin:0 0 20px;text-wrap:balance}
.splash .sbar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.splash .sbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0057b7,#ffd700)}
.splash small{display:block;margin-top:10px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:no-preference){
 .splash-face{animation:sIn .8s cubic-bezier(.2,1.5,.4,1) both}
 .splash h2{animation:sUp .6s .25s both}.splash p{animation:sUp .6s .45s both}
 @keyframes sIn{from{transform:scale(.4) rotate(-12deg);opacity:0}}
 @keyframes sUp{from{transform:translateY(14px);opacity:0}}
}
.splash .sbar i{animation:sFill 3s linear forwards}
@keyframes sFill{to{width:100%}}
.splash-face svg{display:block;width:100%;height:100%}
.exwrap{margin:-4px 0 14px}
.explain{margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.45}
.explain p{margin:0 0 8px}.explain .exuse{color:var(--muted);font-size:14px}
.explain table{border-collapse:collapse;width:100%;max-width:340px;font-size:15px}
.explain td{padding:3px 6px;border-top:1px dashed var(--line)}.explain td.p{color:var(--muted);font-size:13px;width:50%}
.explain tr.hl td{background:var(--saffron-soft);font-weight:700}
.moods{margin:10px 0 30px;border-top:2px solid var(--ink);padding-top:18px}
.moods h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 12px}
.moods .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.moods .m{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.moods .m h4{margin:0 0 6px;font-size:17px;color:var(--tile)}
.moods .m p{margin:0 0 8px;font-size:15px;line-height:1.45}
.moods .ex{color:var(--muted);font-size:14px}.moods .ex b{color:var(--ink)}
footer{color:var(--muted);font-size:13px;padding-block:30px 40px}
@media (prefers-reduced-motion:no-preference){.card.pop{animation:pop .25s ease}@keyframes pop{from{transform:scale(.985)}to{transform:none}}}

/* ---- vocabulario ---- */
.topics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.topic{font:500 14px var(--body);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;text-align:left}
.topic[aria-pressed="true"]{border-color:var(--tile);background:var(--tile-soft);color:var(--tile);font-weight:700}
.topic .tp{display:block;width:100%;min-width:90px;height:4px;border-radius:9px;background:var(--line);overflow:hidden}
.topic .tp i{display:block;height:100%;background:linear-gradient(90deg,#0057b7,#ffd700)}
.topic.hard{border-style:dashed}
.listhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:14px 0 10px;border-top:2px solid var(--ink)}
.listhead h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,40px);margin:0;line-height:1.1}
.listhead span{color:var(--muted);font-size:14px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:30px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0;display:grid;gap:3px}
.wcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.wcard .es{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.wcard .es .art{color:var(--tile);font-weight:600}
.wcard .uk{font-size:15px}
.wcard .ex{color:var(--muted);font-size:13.5px;font-style:italic;line-height:1.35}
.dots{display:flex;gap:3px;margin-top:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ok)}
.say{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--tile);border-radius:8px;width:34px;height:30px;cursor:pointer;display:grid;place-items:center}
.say svg{width:16px;height:16px}
.say.big{width:auto;height:auto;padding:10px 16px;font:700 15px var(--body);display:inline-flex;gap:8px;align-items:center}
.qword{font:400 clamp(34px,9vw,52px)/1.1 var(--display);margin:6px 0 8px;overflow-wrap:anywhere}
.qsub{font-size:clamp(18px,4.6vw,22px);color:var(--muted);margin:0 0 14px}
.wordbox{margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.wordbox .es{font-weight:700;font-size:18px}.wordbox .ex{color:var(--muted);font-style:italic;font-size:14px}
.gbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gbtns .opt{text-align:center;font:400 34px var(--display);padding:18px}
.pairs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:640px){.pairs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{font:600 15px var(--body);min-height:64px;padding:8px 6px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;overflow-wrap:break-word;hyphens:auto;line-height:1.25;min-width:0}
@media (max-width:460px){.tile{font-size:13.5px}}
.tile.uk{font-weight:500}
.tile.sel{border-color:var(--tile);background:var(--tile-soft)}
.tile.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);cursor:default}
.tile.bad{border-color:var(--bad);background:var(--bad-soft)}
.flash{perspective:900px;margin-bottom:12px}
.flash .fface{display:grid;place-items:center;text-align:center;min-height:180px;border-radius:14px;border:2px solid var(--line);background:var(--bg);padding:18px;gap:8px}
.flash .fface .big{font:400 clamp(30px,8vw,46px)/1.1 var(--display)}
.flash .fface .uk{font-size:22px;font-weight:600}
.flash .fface .ex{color:var(--muted);font-style:italic}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn.ok{background:var(--ok)}.btn.no{background:var(--bad)}
.dictbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.hinttxt{color:var(--muted);font-size:16px;margin:0 0 12px}

.langrow{justify-content:space-between;align-items:center;gap:10px}
.homebtn{font:700 14px var(--body);text-decoration:none;color:var(--ink);background:var(--card);padding:8px 14px;border-radius:999px;box-shadow:0 4px 16px rgba(0,30,80,.18)}
.homebtn:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}

/* ---- cabecera compacta ---- */
header .wrap.hdr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:stretch;padding-block:12px 14px}
.hdr .hello{padding:10px 14px;display:grid;align-content:center;gap:2px;min-width:0}
.hdr .eyebrow{font-size:11px;letter-spacing:.12em}
.hdr h1{font-size:clamp(24px,6.6vw,34px);margin:0;line-height:1.1}
.hdr .stats{background:none;box-shadow:none;padding:0;display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:6px}
.hdr .stat{background:none;border:0;padding:0;min-width:0;display:flex;align-items:baseline;gap:4px;flex:none}
.hdr .stat b{font-size:17px;display:inline}
.hdr .stat span{font-size:11.5px}
.hdrside{display:flex;flex-direction:column;gap:8px;justify-content:center}
.hdrside .lang{display:flex;flex-direction:column;border-radius:16px;gap:2px;padding:4px}
.hdrside .lang button{border-radius:12px;padding:7px 10px;font-size:13px}
.hdrbtns{display:flex;gap:8px;justify-content:center}
.hdrbtns .homebtn{width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;color:var(--tile)}
.hellohome{grid-template-columns:auto minmax(0,1fr)!important;column-gap:12px!important;align-items:center}
.hellohome .face{width:72px;height:72px;grid-row:1}
.hellohome .htext{min-width:0;display:grid;gap:2px}
.hellohome .lvl{font-size:12.5px;margin:6px 0 4px;gap:6px}
.hellohome .bar{height:8px}
.hellohome .note{font-size:11.5px;margin:4px 0 0;line-height:1.3}
@media (max-width:420px){.hellohome .face{width:58px;height:58px}.hdr .hello{padding:10px 12px}}

.htop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.htitle{min-width:0}
.htop .face{width:64px;height:64px;flex:none;border-width:2px}
.hdr h1{font-size:clamp(26px,7vw,34px);line-height:1.05}
.hellohome{display:block!important}
.hellohome .lvl{font-size:12.5px;margin:8px 0 4px;gap:6px;display:flex;justify-content:space-between;flex-wrap:wrap}
.hellohome .bar{height:8px}
.hellohome .note{font-size:11.5px;margin:4px 0 0;line-height:1.3;min-height:2.6em}
.hellohome .combo{font-size:11px;padding:1px 8px;margin-left:6px}
@media (max-width:420px){.htop .face{width:56px;height:56px}}

.htop .face{width:86px;height:86px;border-width:3px}
.htop .face svg{transform:scale(1.22) translateY(7%);transform-origin:50% 40%}
@media (max-width:420px){.htop .face{width:78px;height:78px}}
.htitle .eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* cabecera fija */
header{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--kcd,0px));z-index:20;box-shadow:0 4px 14px rgba(0,30,80,.18)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:#0057b7}
main [id]{scroll-margin-top:calc(var(--hdrh,200px) + 12px)}
</style>
</head>
<body>

  <div class="wrap hdr">
    <div class="hello hellohome">
      <div class="htop">
        <div class="htitle"><div class="eyebrow" data-i18n="eyebrow">Dudas y situaciones</div><h1 data-i18n-html="hello">¡Hola,<br><em>Katia</em>!</h1></div>
        <div class="face" id="face" aria-hidden="true"></div>
      </div>
      <div class="lvl"><span><span id="lvlName">Nivel 1</span><span id="combo" class="combo" hidden>×2</span></span><span class="pts" id="lvlPts">0 / 150</span></div>
      <div class="bar"><i id="lvlFill"></i></div>
      <p class="note" id="nextGift"></p>
      <div class="stats" hidden>
        <b id="sPts">0</b><b id="sOk">0</b><b id="sStreak">0</b><b id="sBest">0</b>
      </div>
    </div>
    <div class="hdrside">
      <div class="lang" role="group" aria-label="Idioma / Мова">
        <button id="langEs" aria-pressed="true">Español</button><button id="langUk" aria-pressed="false" lang="uk">Українська</button>
      </div>
      <div class="hdrbtns"><a class="homebtn" href="./" aria-label="Inicio" title="Inicio"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></a></div>
    </div>
  </div>
</header>
<main class="wrap">
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabD" aria-selected="true" data-i18n="tabD">Dudas típicas</button>
    <button class="tab" role="tab" id="tabS" aria-selected="false" data-i18n="tabS">Situaciones</button>
  </nav>
  

  <section id="viewD">
    <div class="topics" id="dTopics"></div>
    <details class="theory card" id="theory" open><summary id="thTitle"></summary><div id="thBody"></div></details>
    <div class="card" id="exercise"></div>
  </section>

  <section id="viewS" hidden>
    <div class="topics" id="sTopics"></div>
    <div class="card dialog" id="dialog"></div>
    <div class="card" id="sQs"></div>

</main>

<footer class="wrap" data-i18n="footer">Cada 10 aciertos en una duda cuentan para tus logros.</footer>

<script>
const DUDAS=[
 {k:'serestar',name:'Ser o estar',uk:'Ser чи estar',
  theory:[
   ['Ser','qué o cómo es algo de forma estable: origen (<i>Katia es ucraniana</i>), profesión, carácter, descripción física (<i>Tomas es alto</i>), material (<i>es de piel</i>), la hora y la fecha (<i>son las cinco; hoy es martes</i>) y dónde se celebra un evento (<i>la fiesta es en casa</i>).'],
   ['Estar','dónde está algo o alguien (<i>Sonia está en el parque</i>), estados temporales (<i>estoy cansada</i>), resultados (<i>la puerta está abierta</i>) y acciones en curso con gerundio (<i>está jugando</i>).'],
   ['Ojo','algunos adjetivos cambian de significado: <i>ser listo</i> (inteligente) / <i>estar listo</i> (preparado); <i>ser aburrido</i> (que aburre) / <i>estar aburrido</i> (que se aburre).']],
  items:[
   ['Katia ___ ucraniana.',['es','está'],0,'Origen y nacionalidad → ser.'],
   ['Sonia ___ en el parque con Katia.',['es','está'],1,'Dónde está alguien → estar.'],
   ['Tomas ___ muy alto para su edad.',['es','está'],0,'Descripción física → ser.'],
   ['Hoy Katia ___ muy cansada.',['es','está'],1,'Estado temporal → estar.'],
   ['La fiesta ___ en casa de la abuela.',['es','está'],0,'Los eventos (fiesta, reunión, partido) «son» en un lugar → ser.'],
   ['La sopa ___ fría: caliéntala un poco.',['es','está'],1,'Cómo está algo en este momento → estar.'],
   ['¿Qué hora ___?',['es','está'],0,'La hora → ser: «son las cinco».'],
   ['Tomas ___ jugando a baloncesto.',['es','está'],1,'Estar + gerundio = acción que está pasando ahora.'],
   ['El médico de Sonia ___ muy simpático.',['es','está'],0,'Carácter → ser.'],
   ['La puerta ___ abierta.',['es','está'],1,'Resultado de una acción → estar + participio.'],
   ['Este bolso ___ de piel.',['es','está'],0,'Material → ser de.'],
   ['¡Qué guapa ___ hoy, Katia!',['eres','estás'],1,'Cómo se ve alguien en un momento concreto → estar.'],
   ['Katia ___ muy lista: aprende rapidísimo.',['es','está'],0,'Ser listo = ser inteligente.'],
   ['¿Ya ___ lista, Katia? Nos vamos.',['eres','estás'],1,'Estar listo = estar preparado.'],
   ['Las chuches ___ para Sonia.',['son','están'],0,'Destinatario → ser para.'],
   ['Hoy ___ martes.',['es','está'],0,'Los días y las fechas → ser.']]},
 {k:'porpara',name:'Por o para',uk:'Por чи para',
  theory:[
   ['Para','finalidad (<i>estudio para trabajar</i>), destinatario (<i>es para Tomas</i>), destino (<i>salimos para PortAventura</i>), plazo (<i>para el lunes</i>) y opinión (<i>para mí</i>).'],
   ['Por','causa (<i>gracias por el regalo; no fuimos por la lluvia</i>), lugar por donde se pasa (<i>paseamos por la playa</i>), partes del día (<i>por la tarde</i>), precio o cambio (<i>por 50 euros</i>), medio (<i>por teléfono</i>) y frecuencia (<i>dos veces por semana</i>).'],
   ['Truco','<i>¿Para qué?</i> pregunta por el objetivo; <i>¿Por qué?</i>, por la causa.']],
  items:[
   ['Este regalo es ___ Tomas.',['por','para'],1,'Destinatario → para.'],
   ['Gracias ___ el chocolate.',['por','para'],0,'Agradecimiento (causa) → gracias por.'],
   ['Katia estudia español ___ hablar con todo el mundo.',['por','para'],1,'Finalidad + infinitivo → para.'],
   ['Paseamos ___ la playa.',['por','para'],0,'Lugar por donde pasamos → por.'],
   ['Salimos ___ PortAventura a las nueve.',['por','para'],1,'Destino → para.'],
   ['Katia cuida a Sonia ___ las tardes.',['por','para'],0,'Partes del día → por la mañana / tarde / noche.'],
   ['Necesito el informe ___ el lunes.',['por','para'],1,'Plazo o fecha límite → para.'],
   ['Compré las entradas ___ 50 euros.',['por','para'],0,'Precio o intercambio → por.'],
   ['Hablamos ___ teléfono.',['por','para'],0,'Medio → por teléfono, por correo.'],
   ['___ mí, la paella es el mejor plato.',['Por','Para'],1,'Opinión → para mí.'],
   ['No fuimos a la playa ___ la lluvia.',['por','para'],0,'Causa → por.'],
   ['Voy al supermercado ___ comprar leche.',['por','para'],1,'Finalidad → para.'],
   ['Tomas entrena dos veces ___ semana.',['por','para'],0,'Frecuencia → por semana, por día.'],
   ['Este tren va ___ Tarragona.',['por','para'],1,'Destino → para. («Pasar por Tarragona» sería atravesarla).'],
   ['¿___ qué estudias español? —Para trabajar aquí.',['Por','Para'],1,'¿Para qué? pregunta por el objetivo.']]},
 {k:'pasado',name:'Indefinido o imperfecto',uk:'Indefinido чи imperfecto',
  theory:[
   ['Indefinido','acciones terminadas en un momento concreto: <i>ayer, el sábado, en 2020, de repente</i>. Cuenta lo que pasó: <i>Ayer Tomas hizo veinte puntos.</i>'],
   ['Imperfecto','descripciones, costumbres y el «fondo» de la historia: <i>antes, siempre, de pequeña, mientras</i>. <i>De pequeña, Katia vivía en Ucrania. Hacía sol.</i>'],
   ['Juntos','el imperfecto pinta la escena y el indefinido cuenta lo que la interrumpe: <i>Katia leía cuando sonó el teléfono.</i>']],
  items:[
   ['Ayer Katia ___ a Sonia al parque.',['llevó','llevaba'],0,'Acción concreta y terminada (ayer) → indefinido.'],
   ['De pequeña, Katia ___ en Ucrania.',['vivió','vivía'],1,'Descripción de una etapa del pasado → imperfecto.'],
   ['Cuando Tomas era pequeño, ___ mucho por las noches.',['lloró','lloraba'],1,'Costumbre en el pasado → imperfecto.'],
   ['El sábado Tomas ___ veinte puntos.',['hizo','hacía'],0,'Hecho puntual → indefinido.'],
   ['Mientras Sonia dormía, Katia ___ un libro.',['leyó','leía'],1,'Dos acciones de fondo a la vez (mientras) → imperfecto.'],
   ['Katia leía cuando ___ el teléfono.',['sonó','sonaba'],0,'La acción que interrumpe → indefinido.'],
   ['El verano pasado Joan y Katia ___ a Madrid.',['viajaron','viajaban'],0,'Hecho concreto en un tiempo cerrado → indefinido.'],
   ['Antes, Tomas siempre ___ a casa en autobús.',['volvió','volvía'],1,'Antes, siempre → costumbre → imperfecto.'],
   ['Hacía sol y ___ mucho calor.',['hizo','hacía'],1,'Descripción del tiempo o del ambiente → imperfecto.'],
   ['Anoche Tomas se ___ a las diez.',['durmió','dormía'],0,'Momento concreto → indefinido.'],
   ['La casa de la abuela ___ un jardín enorme.',['tuvo','tenía'],1,'Descripción → imperfecto.'],
   ['De repente, Sonia ___ a llorar.',['empezó','empezaba'],0,'«De repente» introduce una acción puntual → indefinido.'],
   ['Cuando llegamos a PortAventura, ___ muchísima gente.',['hubo','había'],1,'Descripción de la situación → había.'],
   ['Katia ___ dos horas en la consulta del médico.',['esperó','esperaba'],0,'Duración cerrada y terminada → indefinido.'],
   ['¿Qué hora ___ cuando llegaste?',['fue','era'],1,'La hora en el pasado → imperfecto: «eran las ocho».']]},
 {k:'articulos',name:'Artículos y género',uk:'Артиклі і рід',
  theory:[
   ['Regla general','las palabras en <i>-o</i> suelen ser masculinas (<i>el libro</i>) y las de <i>-a</i>, femeninas (<i>la mesa</i>). Las de <i>-ción, -sión, -dad, -tad</i> son femeninas (<i>la canción, la ciudad</i>).'],
   ['Excepciones','<i>el día, el mapa, el problema, el idioma, el tema</i> (masculinas en -a); <i>la mano, la foto, la moto, la radio</i> (femeninas en -o). Las de <i>-e</i> hay que aprenderlas: <i>el coche, la leche, la noche, el puente</i>.'],
   ['El agua','las palabras femeninas que empiezan por <i>a</i> tónica llevan <i>el</i> en singular: <i>el agua fría, el águila</i>; pero <i>las aguas</i>.'],
   ['Sin artículo','<i>en casa, hoy es lunes, hablo español</i>. Con <i>gustar</i> sí se usa: <i>me gusta el chocolate</i>.']],
  items:[
   ['___ problema',['el','la'],0,'Muchas palabras en -ma son masculinas: el problema, el tema, el idioma.'],
   ['___ mano',['el','la'],1,'Excepción: la mano es femenina aunque acaba en -o.'],
   ['___ agua del grifo está fría.',['El','La'],0,'Agua es femenina, pero lleva «el» porque empieza por «a» tónica.'],
   ['___ día',['el','la'],0,'El día es masculino aunque acaba en -a.'],
   ['___ foto',['el','la'],1,'La foto (de «la fotografía»). Igual: la moto, la radio.'],
   ['___ canción',['el','la'],1,'Las palabras en -ción y -sión son femeninas.'],
   ['___ coche',['el','la'],0,'Las palabras en -e hay que aprenderlas: el coche, el puente…'],
   ['___ leche',['el','la'],1,'…la leche, la noche, la gente.'],
   ['___ mapa',['el','la'],0,'El mapa: otra palabra masculina en -a.'],
   ['___ ciudad',['el','la'],1,'Las palabras en -dad y -tad son femeninas.'],
   ['Sonia tiene ___ perro muy simpático.',['un','una'],0,'Perro es masculino → un.'],
   ['Me gusta ___ chocolate.',['el','— (nada)'],0,'Con gustar el sustantivo lleva artículo: me gusta el chocolate.'],
   ['Los viernes trabajo en ___ casa.',['la','— (nada)'],1,'«En casa» (la tuya) va sin artículo: estoy en casa, voy a casa.'],
   ['Hoy es ___ lunes.',['el','— (nada)'],1,'Con «hoy es» no hay artículo. Pero: «el lunes voy al médico».'],
   ['___ señor García es el médico de Tomas.',['El','— (nada)'],0,'Hablando de alguien: el señor García. Hablándole a él: «Buenos días, señor García».']]},
 {k:'gustar',name:'Gustar, encantar, doler',uk:'Gustar, encantar, doler',
  theory:[
   ['Cómo funcionan','el verbo concuerda con lo que gusta, no con la persona: <i>me gusta el chocolate</i> / <i>me gustan las chuches</i>. Con un infinitivo, siempre en singular: <i>me gusta bailar y nadar</i>.'],
   ['Pronombres','me, te, le, nos, os, les: <i>a Sonia le duele la barriga</i>. «A mí, a ti, a ella…» es opcional y sirve para dar énfasis.'],
   ['Igual que gustar','encantar, doler, apetecer, interesar, molestar, dar miedo: <i>¿te apetece un café?</i>; <i>le dan miedo los truenos</i>.']],
  items:[
   ['A Katia le ___ las chuches.',['gusta','gustan'],1,'Las chuches (plural) → gustan.'],
   ['A Tomas le ___ el baloncesto.',['gusta','gustan'],0,'El baloncesto (singular) → gusta.'],
   ['A mí ___ encanta el chocolate.',['me','mi'],0,'«Me» es obligatorio: a mí me encanta.'],
   ['¿A ti te ___ ir a PortAventura?',['gusta','gustas'],0,'Con infinitivo, siempre singular: te gusta ir.'],
   ['A Sonia ___ duele la barriga.',['le','la'],0,'Con doler y gustar se usa le (a ella), no la.'],
   ['Me ___ los pies después del partido.',['duele','duelen'],1,'Los pies (plural) → duelen.'],
   ['A nosotros nos ___ Barcelona.',['encanta','encantamos'],0,'Lo que encanta es Barcelona (singular) → encanta.'],
   ['¿Te ___ un café, Katia?',['apetece','apeteces'],0,'Apetecer funciona como gustar.'],
   ['A Joan y a Katia les ___ viajar.',['gusta','gustan'],0,'Infinitivo → singular.'],
   ['Me ___ la cabeza.',['duele','dolor'],0,'Me duele la cabeza (verbo). Tengo dolor de cabeza (nombre).'],
   ['A Tomas no le ___ las verduras.',['gusta','gustan'],1,'Las verduras (plural) → gustan.'],
   ['___ encantan los girasoles.',['Me','Yo'],0,'Nunca «yo encanto»: me encantan.'],

const fx=document.getElementById('fx'),ctx=fx.getContext('2d');let parts=[],raf=0;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function sizeFx(){fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio}

function confetti(n,x,y){if(RM)return;const d=devicePixelRatio,cols=['#0057b7','#ffd700','#0057b7','#ffd700','#ffffff'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=3+Math.random()*9;
    parts.push({x:x*d,y:y*d,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-7,r:Math.random()*6,vr:(Math.random()-.5)*.35,w:6+Math.random()*7,h:4+Math.random()*5,c:cols[i%cols.length],life:100+Math.random()*60,fl:Math.random()<.14})}
  if(!raf)raf=requestAnimationFrame(step)}
function step(){const d=devicePixelRatio;ctx.clearRect(0,0,fx.width,fx.height);
  parts=parts.filter(p=>p.life-->0&&p.y<fx.height+60);
  for(const p of parts){p.vy+=.28;p.vx*=.985;p.x+=p.vx*d*.6;p.y+=p.vy*d*.6;p.r+=p.vr;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.min(1,p.life/30);
    if(p.fl){ctx.font=`${20*d}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🌻',0,0)}
    else{ctx.fillStyle=p.c;ctx.fillRect(-p.w*d/2,-p.h*d/2,p.w*d,p.h*d)}ctx.restore()}
  raf=parts.length?requestAnimationFrame(step):0}

  burstBig.textContent=t('lvlUp',L+1);burstSmall.textContent=t('lvlNow',lvlLabel(L));
  burst.hidden=false;clearTimeout(burstT);burstT=setTimeout(()=>burst.hidden=true,2600)}
burst.onclick=()=>burst.hidden=true;
function award(ok,almost){
  if(ok){score.ok++;score.streak++;if(window.KC)KC.hit();const m=mult(),g=basePts()*m,before=lvlOf(score.pts);score.pts+=g;store.set('pts',score.pts);
    if(score.streak>score.best){score.best=score.streak;store.set('best',score.best)}
    floatPts('+'+g+(m>1?'  ×'+m:''));fxCard('good');SND.ok();
    const r=exercise.getBoundingClientRect();confetti(score.streak%5===0?140:28,r.left+r.width/2,r.top+50);
    if(mode==='timer'){T.score+=g;T.correct++}
    if(lvlOf(score.pts)>before)setTimeout(levelUp,350);
    moodOk();
  }else{score.streak=0;fxCard('shake');SND.no();if(almost){mood=Math.min(mood,0);paintFace('nope')}else moodBad()}
  paintScore();
}



const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
const sayB=txt=>KC.canSpeak?`<button class="say" data-say="${txt.replace(/"/g,'&quot;')}" aria-label="Escuchar">${SPK}</button>`:'';

/* ---------- dudas ---------- */
let dk=store.get('dtopic',DUDAS[0].k);if(!DUDAS.some(x=>x.k===dk))dk=DUDAS[0].k;
const bags={};
function dst(){return KC.get('dst',{})}
function drawDTopics(){const s=dst();$('dTopics').innerHTML=DUDAS.map(x=>{const n=s[x.k]||0;
  return `<button class="topic" data-k="${x.k}" aria-pressed="${x.k===dk}"><span>${lang==='uk'?x.uk:x.name}</span><span class="tp"><i style="width:${Math.min(100,n*10)}%"></i></span></button>`}).join('')}
function drawTheory(){const d=DUDAS.find(x=>x.k===dk);$('thTitle').textContent=`${t('theory')}: ${d.name}`;
  $('thBody').innerHTML=d.theory.map(([h,txt])=>`<p><b>${h}:</b> ${txt}</p>`).join('')}
function newQ(){
  const d=DUDAS.find(x=>x.k===dk);
  if(!bags[dk]||!bags[dk].length)bags[dk]=shuffle(d.items.map((_,i)=>i));
  const it=d.items[bags[dk].pop()];Q={it,done:false,val:10};renderQ();
}
function renderQ(){
  const [sent,opts,ans,why]=Q.it,n=dst()[dk]||0;
  exercise.innerHTML=`<div class="qmeta"><span class="pill">${DUDAS.find(x=>x.k===dk).name}</span><span class="pill s">${t('doneTopic',n)}</span></div>
   <p class="qsub">${t('practice')}</p><p class="q">${sent.replace('___','<span class="blank">&nbsp;?&nbsp;</span>')}</p>
   <div class="options">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><kbd>${i+1}</kbd>${o}</button>`).join('')}</div><div id="fb"></div>`;
  exercise.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  if(Q.done)paint();
}
function choose(i){if(Q.done)return;Q.done=true;Q.picked=i;const ok=i===Q.it[2];Q.ok=ok;Q.praise=Math.floor(Math.random()*5);
  if(ok){const s=dst();s[dk]=(s[dk]||0)+1;KC.set('dst',s)}
  award(ok,false);paint(true);drawDTopics();
  if(ok){const q=Q;setTimeout(()=>{if(Q===q&&!$('viewD').hidden)newQ()},2200)}}
function paint(first){
  const [sent,opts,ans,why]=Q.it,fb=$('fb');
  exercise.querySelectorAll('.opt').forEach(x=>{const i=+x.dataset.i;x.disabled=true;if(i===ans)x.classList.add('right');if(i===Q.picked&&!Q.ok)x.classList.add('wrong')});
  const full=sent.replace('___',opts[ans].startsWith('—')?'':opts[ans]).replace(/\s+/g,' ').replace(/^ /,'');
  fb.className='feedback '+(Q.ok?'ok':'no');
  fb.innerHTML=`${Q.ok?t('praise')[Q.praise]:t('wrong')} <b>${full}</b>${sayB(full)}<div class="why">${why}</div>`;
  exercise.querySelector('.options').before(fb);
  if(!Q.ok){const n=document.createElement('div');n.className='next';n.innerHTML=`<button class="btn" id="nx">${t('next')}</button>`;exercise.appendChild(n);$('nx').onclick=newQ;if(first)$('nx').focus()}
}
$('dTopics').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;dk=b.dataset.k;store.set('dtopic',dk);drawDTopics();drawTheory();newQ()});

/* ---------- situaciones ---------- */
let sk=store.get('stopic',SITS[0].k);if(!SITS.some(x=>x.k===sk))sk=SITS[0].k;
let SA={};let playing=false;
function drawSTopics(){const done=KC.get('sits',[]);$('sTopics').innerHTML=SITS.map(x=>`<button class="topic" data-k="${x.k}" aria-pressed="${x.k===sk}"><span>${done.includes(x.k)?'✓ ':''}${lang==='uk'?x.uk:x.name}</span></button>`).join('')}
function drawDialog(){const s=SITS.find(x=>x.k===sk);
  $('dialog').innerHTML=`<div class="dhead"><h2>${s.name}</h2>${KC.canSpeak?`<button class="btn ghost" id="playAll">${playing?t('stop'):t('listenAll')}</button>`:''}</div>
   <div class="lines">${s.lines.map(([who,txt],i)=>`<div class="line${who==='Katia'?' me':''}" data-l="${i}"><span class="who">${who}</span><span class="txt">${txt}</span>${sayB(txt)}</div>`).join('')}</div>`;
  if($('playAll'))$('playAll').onclick=playAll;
  drawQs();}
function playAll(){
  if(playing){playing=false;try{speechSynthesis.cancel()}catch(e){}drawDialog();return}
  const s=SITS.find(x=>x.k===sk);playing=true;drawDialog();let i=0;
  const next=()=>{if(!playing||i>=s.lines.length){playing=false;drawDialog();return}
    document.querySelectorAll('.line').forEach(x=>x.classList.toggle('now',+x.dataset.l===i));
    try{const u=new SpeechSynthesisUtterance(s.lines[i][1]);u.lang='es-ES';u.rate=.9;u.onend=()=>{i++;next()};u.onerror=()=>{i++;next()};speechSynthesis.speak(u)}catch(e){playing=false}};
  try{speechSynthesis.cancel()}catch(e){}next();
}
function drawQs(){const s=SITS.find(x=>x.k===sk),a=SA[sk]||(SA[sk]=[]);
  const answered=a.filter(x=>x!==undefined).length,right=s.qs.filter((q,i)=>a[i]===q[2]).length;
  $('sQs').innerHTML=`<h3 class="qh">${t('questions')}</h3>`+s.qs.map(([q,opts,ans],qi)=>`<div class="sq"><p class="sqq">${qi+1}. ${q}</p><div class="options">${opts.map((o,i)=>{
      const st=a[qi]===undefined?'':i===ans?' right':i===a[qi]?' wrong':'';return `<button class="opt${st}" data-q="${qi}" data-i="${i}"${a[qi]!==undefined?' disabled':''}>${o}</button>`}).join('')}</div></div>`).join('')+
    (answered===s.qs.length?`<div class="feedback ${right===s.qs.length?'ok':'almost'}">${right===s.qs.length?t('sitAll'):t('sitScore',right,s.qs.length)}</div><div class="next"><button class="btn" id="sAgain">${t('again')}</button></div>`:'');
  $('sQs').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const qi=+b.dataset.q,i=+b.dataset.i;if(a[qi]!==undefined)return;a[qi]=i;const ok=i===s.qs[qi][2];Q={val:10};award(ok,false);
    if(a.filter(x=>x!==undefined).length===s.qs.length&&s.qs.every((q,j)=>a[j]===q[2])){const d=KC.get('sits',[]);if(!d.includes(sk)){d.push(sk);KC.set('sits',d);KC.checkBadges()}
      const r=$('sQs').getBoundingClientRect();confetti(160,r.left+r.width/2,r.top+40)}
    drawQs();drawSTopics()});
  if($('sAgain'))$('sAgain').onclick=()=>{SA[sk]=[];drawQs()};
}
$('sTopics').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;playing=false;try{speechSynthesis.cancel()}catch(_){}sk=b.dataset.k;store.set('stopic',sk);drawSTopics();drawDialog()});

/* ---------- pestañas e idioma ---------- */
function setTab(s){$('tabD').setAttribute('aria-selected',!s);$('tabS').setAttribute('aria-selected',s);$('viewD').hidden=s;$('viewS').hidden=!s;store.set('gtab',s);
  if(!s){playing=false;try{speechSynthesis.cancel()}catch(_){}}}
$('tabD').onclick=()=>setTab(false);$('tabS').onclick=()=>setTab(true);
function applyLang(){
  document.documentElement.lang=lang==='uk'?'uk':'es';document.title=t('title');
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el=>el.innerHTML=t(el.dataset.i18nHtml));
  langEs.setAttribute('aria-pressed',lang==='es');langUk.setAttribute('aria-pressed',lang==='uk');
  paintScore();drawDTopics();drawTheory();drawSTopics();drawDialog();if(Q&&Q.it)renderQ();
}
addEventListener('kc-sound',e=>{sound=e.detail;if(sound)SND.ok()});
langEs.onclick=()=>{lang='es';store.set('lang','es');applyLang()};langUk.onclick=()=>{lang='uk';store.set('lang','uk');applyLang()};
applyLang();newQ();paintFace();
if(store.get('gtab',false))setTab(true);
</script>
<script>
if('serviceWorker' in navigator&&location.protocol!=='file:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
