<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0057b7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Español Katia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>El vocabulario de Katia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>

/* Layout: azulejo-patterned header band, then two tabs — "Conjugar" (verb chips + tense tables) and "Practicar" (exercise card + settings). */
:root{
  --bg:#f3f5fa; --card:#ffffff; --ink:#1b2a4a; --muted:#5d6a85; --line:#d9deec;
  --tile:#2747a8; --tile-soft:#e3e9fb; --saffron:#e3a020; --saffron-soft:#fdf1d6;
  --ok:#2c8657; --ok-soft:#e1f3e9; --bad:#c13d36; --bad-soft:#fbe5e3;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1528; --card:#171f3b; --ink:#e7ebf7; --muted:#9ba6c3; --line:#2a3459;
  --tile:#86a2ff; --tile-soft:#1f2a52; --saffron:#f0b94a; --saffron-soft:#3a2f17;
  --ok:#5fd095; --ok-soft:#173627; --bad:#ff8a80; --bad-soft:#3c1d1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1528; --card:#171f3b; --ink:#e7ebf7; --muted:#9ba6c3; --line:#2a3459;
  --tile:#86a2ff; --tile-soft:#1f2a52; --saffron:#f0b94a; --saffron-soft:#3a2f17;
  --ok:#5fd095; --ok-soft:#173627; --bad:#ff8a80; --bad-soft:#3c1d1d; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0057b7 0 50%,#ffd700 50% 100%)}
header .wrap{padding-block:16px 28px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between}
.hello{background:var(--card);border-radius:16px;padding:16px 22px;box-shadow:0 6px 24px rgba(0,30,80,.18);min-width:0}
.stats{background:var(--card);border-radius:16px;padding:10px;box-shadow:0 6px 24px rgba(0,30,80,.18)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,46px);line-height:1.05;margin:6px 0 6px;text-wrap:balance}
h1 em{font-style:normal;color:var(--tile)}
.sub{color:var(--muted);margin:0;max-width:52ch}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:92px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat span{font-size:12px;color:var(--muted)}

nav.tabs{display:flex;gap:6px;margin:22px 0 18px}
.tab{font:600 15px var(--body);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 18px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--tile);border-color:var(--tile);color:var(--card)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}

/* Conjugar */
.search{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search input{font:inherit;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:min(280px,100%)}
.groups{display:grid;gap:12px;margin-bottom:22px}
.group h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 15px var(--body);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
.chip:hover{border-color:var(--tile)}
.chip[aria-pressed="true"]{background:var(--tile-soft);border-color:var(--tile);color:var(--tile);font-weight:700}

.verbhead{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:baseline;padding:18px 0 14px;border-top:2px solid var(--ink)}
.verbhead h2{font-family:var(--display);font-weight:400;font-size:clamp(34px,7vw,52px);margin:0;line-height:1}
.verbhead .gloss{color:var(--muted);font-size:17px}
.forms{display:flex;gap:18px;flex-wrap:wrap;font-size:15px}
.forms span{color:var(--muted)}
.forms b{font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 14px}
.legend i{font-style:normal;color:var(--tile);font-weight:700}
.legend .irr{color:var(--saffron);font-weight:700}

.mood{margin:8px 0 22px}
.mood > h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 10px}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.t{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.t h4{margin:0;font-size:15px;font-weight:700}
.t p.use{margin:2px 0 10px;font-size:13px;color:var(--muted);line-height:1.35}
.t table{width:100%;border-collapse:collapse;font-size:15px}
.t td{padding:4px 0;border-top:1px dashed var(--line);vertical-align:baseline}
.t td.p{color:var(--muted);font-size:13px;width:44%;padding-right:8px}
.t td.f{font-weight:500}
.f .end{color:var(--tile);font-weight:700}
.f .aux{color:var(--muted);font-weight:400}
.f.irr{position:relative}
.f.irr::after{content:"●";color:var(--saffron);font-size:9px;margin-left:6px;vertical-align:middle}
.compound .t{background:transparent}

/* Practicar */
.practice{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:820px){.practice{grid-template-columns:1fr}}
.modes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pill{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--tile-soft);color:var(--tile);font-weight:600}
.pill.s{background:var(--saffron-soft);color:var(--ink)}
.q{font-family:var(--display);font-size:clamp(25px,6.5vw,32px);line-height:1.25;margin:0 0 6px;text-wrap:balance}
.q .blank{display:inline-block;min-width:4ch;border-bottom:3px solid var(--saffron);color:var(--tile)}
.qhint{color:var(--muted);margin:0 0 16px;font-size:15px}
.answer{display:flex;gap:8px;flex-wrap:wrap}
.answer input{flex:1 1 220px;min-width:0;font:500 19px var(--body);padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{font:700 15px var(--body);padding:12px 18px;border-radius:10px;border:0;background:var(--tile);color:var(--card);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.accents{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.accents button{font:600 16px var(--body);width:38px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:460px){.options{grid-template-columns:1fr}}
.opt{font:500 18px var(--body);text-align:left;padding:14px 16px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--tile)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.feedback{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:15px}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.no{background:var(--bad-soft);color:var(--bad)}
.feedback.almost{background:var(--saffron-soft);color:var(--ink)}
.feedback b{font-weight:800;font-size:1.25em}
.feedback{margin:0 0 14px!important}
.next{margin-top:14px;display:flex;justify-content:flex-end}

aside.settings{display:grid;gap:16px}
.settings h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.settings select{font:inherit;width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.checks{display:grid;gap:4px;font-size:14px}
.checks label{display:flex;gap:8px;align-items:center;cursor:pointer}
.checks .mlabel{font-size:12px;color:var(--muted);margin-top:6px;font-weight:600}
.minis{display:flex;gap:8px;margin-top:6px}
.minis button{font:600 12px var(--body);background:none;border:0;color:var(--tile);cursor:pointer;padding:0;text-decoration:underline}
.note{font-size:13px;color:var(--muted);line-height:1.45}
#exercise{position:relative;overflow:hidden;min-height:300px}
.card.good{box-shadow:0 0 0 3px var(--ok),0 12px 34px rgba(44,134,87,.25)}
.card.shake{box-shadow:0 0 0 3px var(--bad)}
.floatpts{position:absolute;left:50%;top:14px;transform:translateX(-50%);font:400 34px var(--display);color:var(--ok);pointer-events:none;white-space:nowrap;opacity:0}
.levelbar{margin-bottom:12px}
.lvl{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:700;margin-bottom:6px;align-items:center;flex-wrap:wrap}
.lvl .pts{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.bar,.tbar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i,.tbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0057b7,#ffd700);border-radius:99px;transition:width .5s ease}
.tbar{margin-bottom:8px}.tbar i{transition:width .2s linear}
.tbar.hurry i{background:var(--bad)}
.combo{display:inline-block;background:#ffd700;color:#0b2a66;border-radius:99px;padding:2px 10px;font-weight:800;font-size:13px;margin-left:8px}
.tinfo{display:flex;justify-content:space-between;font-weight:600;margin-bottom:12px;font-variant-numeric:tabular-nums}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.burst{position:fixed;inset:0;display:grid;place-items:center;z-index:40;background:rgba(0,40,110,.4);padding:16px;cursor:pointer}
.burst-inner{background:var(--card);border-radius:24px;padding:28px 36px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);border:5px solid #ffd700;max-width:420px}
.burst .big{font:400 clamp(44px,11vw,76px)/1 var(--display);color:var(--tile);margin-bottom:8px}
.intro{text-align:center;padding:6px 0}
.intro .q{margin-top:6px}
.btn.big{font-size:20px;padding:16px 36px;margin-top:6px}
.count{font:400 130px/1 var(--display);text-align:center;color:var(--tile);padding:50px 0}
.result-big{font:400 84px/1 var(--display);color:var(--tile);text-align:center;margin-top:8px}
.opt kbd{font:600 12px var(--body);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px;margin-right:10px;vertical-align:2px}
.linkbtn{font:600 13px var(--body);background:none;border:0;color:var(--tile);cursor:pointer;padding:0;text-decoration:underline}
@media (prefers-reduced-motion:no-preference){
 .card.shake{animation:shake .4s}
 @keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
 .card.good{animation:glow .5s}
 @keyframes glow{40%{transform:scale(1.015)}}
 .floatpts{animation:floatup 1.1s ease-out forwards}
 @keyframes floatup{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}20%{opacity:1;transform:translate(-50%,-4px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
 .combo{animation:pulse .9s infinite}
 @keyframes pulse{50%{transform:scale(1.12)}}
 .burst-inner,.count,.result-big{animation:zoom .55s cubic-bezier(.2,1.6,.4,1)}
 @keyframes zoom{from{transform:scale(.3);opacity:0}}
}
@media (prefers-reduced-motion:reduce){.floatpts{opacity:1}}
.qverb{font:400 clamp(44px,12vw,60px)/1 var(--display);margin:6px 0 8px;overflow-wrap:anywhere}
.qperson{font:700 clamp(21px,5.8vw,26px)/1.2 var(--body);color:var(--tile);margin:0 0 10px}
@media (max-width:600px){
 .card{padding:18px}
 .qhint{font-size:16px}
 .opt{font-size:21px;padding:16px}
 .answer input{font-size:21px;padding:14px}
 .btn{font-size:17px;padding:14px 20px}
 .accents button{width:44px;height:42px;font-size:18px}
 .pill{font-size:14px}
 .stat{min-width:0;flex:1 1 70px;padding:6px 10px}
 .stat b{font-size:20px}
}
.langrow{flex-basis:100%;display:flex;justify-content:flex-end}
.lang{display:inline-flex;gap:4px;background:var(--card);padding:4px;border-radius:999px;box-shadow:0 4px 16px rgba(0,30,80,.18)}
.lang button{font:700 14px var(--body);border:0;background:transparent;color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--tile);color:var(--card)}
.selinfo{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:-4px 0 10px}
.selinfo b{color:var(--ink)}
.hud{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;margin-bottom:12px}
.hud .levelbar{margin:0}
.face{width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--tile-soft),var(--card) 72%);border:3px solid var(--line);overflow:hidden;flex:none;transition:border-color .3s}
.face svg{display:block;width:100%;height:100%}
.face.m3,.face.m2{border-color:#ffd700}.face.m-2,.face.m-3{border-color:var(--bad)}
.face .eyes{transform-box:fill-box;transform-origin:center}
@media (max-width:600px){.face{width:84px;height:84px}.hud{gap:12px}}
@media (prefers-reduced-motion:no-preference){
 .face .eyes.blink{animation:blink 4.6s infinite}
 @keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
 .face.hop{animation:hop .55s cubic-bezier(.3,1.8,.5,1)}
 @keyframes hop{30%{transform:translateY(-10px) rotate(-4deg)}60%{transform:translateY(0) rotate(3deg)}}
 .face.nope{animation:nope .5s}
 @keyframes nope{20%{transform:rotate(-9deg)}45%{transform:rotate(8deg)}70%{transform:rotate(-4deg)}}
 .face .spark{animation:spark 1.4s infinite;transform-box:fill-box;transform-origin:center}
 @keyframes spark{50%{transform:scale(.5);opacity:.4}}
 .face .tear{animation:tear 1.6s infinite}
 @keyframes tear{0%{transform:translateY(-3px);opacity:0}30%{opacity:1}100%{transform:translateY(9px);opacity:0}}
}
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:linear-gradient(180deg,#0057b7 0 50%,#ffd700 50% 100%);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:pointer;transition:opacity .6s ease,visibility .6s}
.splash.out{opacity:0;visibility:hidden}
.splash-card{background:var(--card);border-radius:28px;padding:28px 28px 22px;max-width:400px;width:100%;text-align:center;box-shadow:0 24px 70px rgba(0,25,70,.35)}
.splash-face{width:180px;height:180px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 40%,var(--tile-soft),var(--card) 72%);border:6px solid #ffd700;box-shadow:0 0 0 6px #0057b7;display:block;margin:0 auto 18px}
.splash h2{font:400 clamp(36px,10vw,48px)/1.05 var(--display);margin:0 0 10px;color:var(--ink)}
.splash h2 em{font-style:normal;color:var(--tile)}
.splash p{font-size:18px;line-height:1.45;color:var(--muted);margin:0 0 20px;text-wrap:balance}
.splash .sbar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.splash .sbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0057b7,#ffd700)}
.splash small{display:block;margin-top:10px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:no-preference){
 .splash-face{animation:sIn .8s cubic-bezier(.2,1.5,.4,1) both}
 .splash h2{animation:sUp .6s .25s both}.splash p{animation:sUp .6s .45s both}
 @keyframes sIn{from{transform:scale(.4) rotate(-12deg);opacity:0}}
 @keyframes sUp{from{transform:translateY(14px);opacity:0}}
}
.splash .sbar i{animation:sFill 3s linear forwards}
@keyframes sFill{to{width:100%}}
.splash-face svg{display:block;width:100%;height:100%}
.exwrap{margin:-4px 0 14px}
.explain{margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.45}
.explain p{margin:0 0 8px}.explain .exuse{color:var(--muted);font-size:14px}
.explain table{border-collapse:collapse;width:100%;max-width:340px;font-size:15px}
.explain td{padding:3px 6px;border-top:1px dashed var(--line)}.explain td.p{color:var(--muted);font-size:13px;width:50%}
.explain tr.hl td{background:var(--saffron-soft);font-weight:700}
.moods{margin:10px 0 30px;border-top:2px solid var(--ink);padding-top:18px}
.moods h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 12px}
.moods .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.moods .m{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.moods .m h4{margin:0 0 6px;font-size:17px;color:var(--tile)}
.moods .m p{margin:0 0 8px;font-size:15px;line-height:1.45}
.moods .ex{color:var(--muted);font-size:14px}.moods .ex b{color:var(--ink)}
footer{color:var(--muted);font-size:13px;padding-block:30px 40px}
@media (prefers-reduced-motion:no-preference){.card.pop{animation:pop .25s ease}@keyframes pop{from{transform:scale(.985)}to{transform:none}}}

/* ---- vocabulario ---- */
.adultsw{display:flex;align-items:center;gap:8px;margin:22px 0 4px;font-size:13px;color:var(--muted);cursor:pointer}.adultsw input{width:18px;height:18px;accent-color:var(--tile)}
.topics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.topic{font:500 14px var(--body);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;text-align:left}
.topic[aria-pressed="true"]{border-color:var(--tile);background:var(--tile-soft);color:var(--tile);font-weight:700}
.topic .tp{display:block;width:100%;min-width:90px;height:4px;border-radius:9px;background:var(--line);overflow:hidden}
.topic .tp i{display:block;height:100%;background:linear-gradient(90deg,#0057b7,#ffd700)}
.topic.hard{border-style:dashed}
.listhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:14px 0 10px;border-top:2px solid var(--ink)}
.listhead h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,40px);margin:0;line-height:1.1}
.listhead span{color:var(--muted);font-size:14px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:30px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0;display:grid;gap:3px}
.wcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.wcard .es{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.wcard .es .art{color:var(--tile);font-weight:600}
.wcard .uk{font-size:15px}

body{padding-top:calc(var(--hdrh,130px) + var(--kcd,0px))}

.hcol{gap:4px}

function confetti(n,x,y){if(RM)return;const d=devicePixelRatio,cols=['#0057b7','#ffd700','#0057b7','#ffd700','#ffffff'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=3+Math.random()*9;
    parts.push({x:x*d,y:y*d,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-7,r:Math.random()*6,vr:(Math.random()-.5)*.35,w:6+Math.random()*7,h:4+Math.random()*5,c:cols[i%cols.length],life:100+Math.random()*60,fl:Math.random()<.14})}

  raf=parts.length?requestAnimationFrame(step):0}

let recent=[];
const WEIGHT=[6,4,3,1.6,.8,.4];
function pickWords(n,filter){
  let pool=poolAll().filter(filter||(()=>true));
  if(pool.length<n)pool=W.filter(filter||(()=>true));
  const out=[];let guard=0;
  while(out.length<n&&guard++<400){
    let tot=0;const ws=pool.map(w=>{const x=(out.includes(w)?0:(recent.includes(w.id)?.05:1))*(WEIGHT[box(w.id)]+Math.min(wrongs(w.id),4));tot+=x;return x});
    if(tot<=0)break;let r=Math.random()*tot,i=0;while(r>ws[i]){r-=ws[i];i++}
    out.push(pool[Math.min(i,pool.length-1)]);
  }
  for(const w of out){recent.push(w.id);if(recent.length>30)recent.shift()}
  return out;
}
const ukParts=s=>s.toLowerCase().split(/[,;()]/).map(x=>x.trim()).filter(Boolean);
function distract(w,key,n,filter){
  const same=W.filter(x=>x.tk===w.tk&&x!==w&&(filter?filter(x):true));
  const pool=same.length>=n?same:W.filter(x=>x!==w&&(filter?filter(x):true));
  const bad=new Set(ukParts(w.uk)),seen=new Set([key(w)]),out=[];
  for(const x of shuffle(pool.slice())){const k=key(x);if(seen.has(k))continue;if(ukParts(x.uk).some(p=>bad.has(p)))continue;seen.add(k);out.push(x);if(out.length>=n)break}
  return out;
}
const nounSg=w=>w.art==='el'||w.art==='la';

const gapCache={};
function findGap(w){if(w.id in gapCache)return gapCache[w.id];const b=w.bare.replace(/[¡!¿?]/g,'').trim();let r=-1;
  if(b.length>1){const m=new RegExp('(^|[^\\p{L}])('+b.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![\\p{L}])','iu').exec(w.ex);if(m)r=m.index+m[1].length}
  return gapCache[w.id]=r}

/* ---------- normalizar respuestas ---------- */
const strip=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
const norm=s=>s.toLowerCase().replace(/[¡!¿?.,;:«»"—]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){const m=a.length,n=b.length;let d=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){let prev=d[0];d[0]=i;for(let j=1;j<=n;j++){const tmp=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=tmp}}return d[n]}
function judge(typed,w){
  const a=norm(typed),alts=w.es.includes(' / ')?[w.es,...w.es.split(' / ')]:[w.es];
  for(const x of alts){const b=norm(x);if(a===b)return 'ok'}
  for(const x of alts){const b=norm(x);if(strip(a)===strip(b)||lev(a,b)<=1)return 'almost'}
  if(w.art&&(a===norm(w.bare)||strip(a)===strip(norm(w.bare))))return 'noart';
  return 'no';
}

  const pr=t('praise');
  fb.className='feedback '+(kind==='ok'?'ok':kind==='no'?'no':'almost');
  fb.innerHTML=kind==='ok'?`${Q.streakAt>0&&Q.streakAt%5===0?t('streakMsg',Q.streakAt):pr[Q.praise%pr.length]} <b>${esc(shown)}</b>`
    :kind==='noart'?t('missArt',esc(Q.w.es)):kind==='almost'?t('almost',esc(Q.w.es)):t('wrong',esc(shown));
  if(kind!=='ok'||Q.mode==='dict'||Q.mode==='gap'||Q.gender){
    const wb=document.createElement('div');wb.className='wordbox';
    wb.innerHTML=`<div class="top" style="display:flex;justify-content:space-between;gap:8px"><span class="es">${esHTML(Q.w)}</span>${canSpeak?sayBtn(Q.w.es):''}</div><span lang="uk">${esc(Q.w.uk)}</span><span class="ex">${esc(Q.w.ex)}</span><button class="kc-rep" data-rep="${esc(Q.w.id)}">${t('report')}</button>`;
    fb.appendChild(wb);
  }
  if(Q.mode==='speak'){if($('micRow'))$('micRow').remove();if($('micMsg'))$('micMsg').remove();if(Q.heard)fb.insertAdjacentHTML('afterbegin',`<div class="hinttxt" style="margin:0 0 6px">${t('heard',esc(Q.heard))}</div>`)}
  if((Q.opts||Q.mode==='speak')&&kind!=='ok'){const n=document.createElement('div');n.className='next';n.innerHTML=`<button class="btn" id="nx">${t('next')}</button>`;exercise.appendChild(n);const nx=$('nx');nx.onclick=newQ;if(first)nx.focus()}
}

/* ---------- contrarreloj ---------- */
function timerIntro(){freshCard();screen='tintro';renderIntro()}
function renderIntro(){
  exercise.innerHTML=`<div class="intro"><div class="eyebrow">${t('tEyebrow')}</div><p class="q">${t('tQ')}</p><p class="qhint">${t('tHint')}</p><p class="qhint">${t('tRec',T.best)}</p><button class="btn big" id="go">${t('tGo')}</button></div>`;
  $('go').onclick=countdown;
}
function countdown(){let n=3;const tok=++qToken;screen='count';
  const show=()=>{if(tok!==qToken)return;if(n===0){SND.go();timerRun();return}
    exercise.className='card';exercise.innerHTML=`<div class="count">${n}</div>`;SND.tick();n--;setTimeout(show,700)};show()}
function timerRun(){T.running=true;T.end=Date.now()+60000;T.score=0;T.correct=0;score.streak=0;paintScore();clearInterval(T.int);T.int=setInterval(tickTimer,200);newQ()}
function tickTimer(){if(!T.running)return;const left=Math.max(0,T.end-Date.now());
  const tl=$('tleft'),tf=$('tfill'),tb=$('tbar'),ts=$('tscorew');
  if(tl)tl.textContent=Math.ceil(left/1000);if(tf)tf.style.width=(left/600)+'%';if(tb)tb.classList.toggle('hurry',left<10000);if(ts)ts.textContent=t('pts',T.score);
  if(left<=0)timerEnd()}
function timerEnd(){T.running=false;clearInterval(T.int);qToken++;const rec=T.score>T.best;if(rec){T.best=T.score;store.set('tbest',T.best)}
  T.lastRec=rec;freshCard();screen='tend';renderEnd();if(rec){mood=3;paintFace('hop');SND.lvl();const r=exercise.getBoundingClientRect();confetti(240,r.left+r.width/2,r.top+80)}}
function renderEnd(){exercise.innerHTML=`<div class="intro"><div class="eyebrow">${t('tEnd')}</div><div class="result-big">${T.score}</div><p class="qhint">${t('tSum',T.score,T.correct)}</p>
  <p class="q" style="font-size:24px">${T.lastRec?t('tNew'):t('tKeep',T.best)}</p><button class="btn big" id="again">${t('tAgain')}</button></div>`;$('again').onclick=countdown}
function stopTimer(){if(T.running){T.running=false;clearInterval(T.int)}qToken++}
function rerender(){
  if(screen==='q'&&Q){const inp=$('ans'),typed=inp&&!Q.done?inp.value:null;renderQ();if(typed&&$('ans'))$('ans').value=typed}
  else if(screen==='tintro')renderIntro();else if(screen==='tend')renderEnd();
}

/* ---------- controles ---------- */
function paintSnd(){}
addEventListener('kc-sound',e=>{sound=e.detail;if(sound)SND.ok()});
let armed=0,armT=0;
resetPts.onclick=()=>{
  if(!armed){armed=1;resetPts.textContent=t('resetSure');clearTimeout(armT);armT=setTimeout(()=>{armed=0;resetPts.textContent=t('reset')},3500);return}
  armed=0;clearTimeout(armT);score.pts=0;score.best=0;score.streak=0;score.ok=0;T.best=0;ST={};
  store.set('pts',0);store.set('best',0);store.set('tbest',0);store.set('st',{});paintScore();paintSel();mood=1;paintFace();resetPts.textContent=t('resetDone');
  setTimeout(()=>resetPts.textContent=t('reset'),2000);
};
document.addEventListener('keydown',e=>{
  if(viewP.hidden||!Q||Q.mode==='pairs'||Q.mode==='cards')return;
  if(Q.opts&&e.target.tagName!=='INPUT'){
    if(/^[1-4]$/.test(e.key)&&!Q.done){const b=exercise.querySelectorAll('.opt')[+e.key-1];if(b){e.preventDefault();choose(b)}}
    else if(e.key==='Enter'&&Q.done&&Q.mode!=='timer'){e.preventDefault();newQ()}
  }
});
function applyLang(redraw){
  document.documentElement.lang=lang==='uk'?'uk':'es';document.title=t('title');
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el=>el.innerHTML=t(el.dataset.i18nHtml));
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  resetPts.textContent=t('reset');armed=0;
  langEs.setAttribute('aria-pressed',lang==='es');langUk.setAttribute('aria-pressed',lang==='uk');
  drawModes();drawTopicSel();paintSel();paintScore();paintSnd();drawTopics();drawWords();
  if(redraw)rerender();
}
function setLang(l){if(l===lang)return;lang=l;store.set('lang',l);applyLang(true)}
langEs.onclick=()=>setLang('es');langUk.onclick=()=>setLang('uk');
applyLang(false);
paintFace();
(function(){
  const sp=$('splash');if(!sp)return;
  $('splashFace').innerHTML=faceSVG(2,lvlOf(score.pts));
  $('splashHello').innerHTML=t('hello');$('splashMsg').textContent=rnd(t('splash'));$('splashSkip').textContent=t('skip');
  let gone=false;const close=()=>{if(gone)return;gone=true;sp.classList.add('out');setTimeout(()=>sp.hidden=true,700)};
  sp.addEventListener('click',close);document.addEventListener('keydown',close,{once:true});setTimeout(close,3000);
})();
if(window.KC&&KC.dailyActive('vocab')){DAILY=true;KC.dailyBar('vocab');setTab(true);newQ()}
else if(store.get('tab',false))setTab(true);
</script>
